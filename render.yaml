services:
  - type: web
    name: nija-trading-bot
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/render_entrypoint.sh
    autoDeployTrigger: commit
    numInstances: 1
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PORT
        value: "5000"
      - key: WEB_CONCURRENCY
        value: "1"
      # Bound native numerical-library threads and glibc allocation arenas on
      # the memory-constrained Render worker. This changes resource usage only;
      # strategy calculations and live-trading safety gates are unchanged.
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: NIJA_RENDER_MEMORY_TRIM_THRESHOLD
        value: "0.72"
      - key: NIJA_RENDER_MEMORY_GUARD_INTERVAL_S
        value: "5"
      - key: NIJA_RENDER_MEMORY_TRIM_MIN_GAP_S
        value: "10"
      - key: ALLOW_CONSUMER_USD
        value: "true"

      # Use the Render private-network connection string from the managed Key
      # Value service below. The web service and Key Value service are pinned to
      # the same region so the internal Redis URL remains routable.
      - key: NIJA_REDIS_URL
        fromService:
          type: keyvalue
          name: nija-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nija-redis
          property: connectionString
      # Existing Render services created outside this Blueprint may not receive
      # fromService variables. The bootstrap uses this private, credential-free
      # endpoint only when every standard Redis URL variable is absent.
      - key: NIJA_RENDER_REDIS_FALLBACK_URL
        value: "redis://red-d98dsl5aeets73fpb0hg:6379"
      - key: NIJA_REDIS_CONNECT_MAX_TOTAL_WAIT_S
        value: "12"
      - key: NIJA_REDIS_PERSISTENCE_REQUIRED
        value: "true"
      - key: NIJA_REQUIRE_DISTRIBUTED_LOCK
        value: "true"
      - key: STRICT_REDIS_WRITER_LOCK
        value: "true"
      - key: NIJA_STRICT_REDIS_LEASE
        value: "true"
      - key: NIJA_REDIS_RESET_POLICY
        value: "require_confirmation"

      # Production-safe small-account order floors. The bootstrap preserves any
      # stricter dashboard value and prevents internally inconsistent limits.
      - key: NIJA_MIN_CASH_RESERVE_USD
        value: "5.00"
      - key: MIN_TRADE_USD
        value: "3.50"
      - key: MIN_NOTIONAL_USD
        value: "3.50"
      - key: MIN_POSITION_USD
        value: "3.50"
      - key: MIN_CASH_TO_BUY
        value: "5.00"
      - key: MINIMUM_TRADING_BALANCE
        value: "5.00"

      # Multi-venue routing. Every connected venue is scanned independently and
      # sized only from its own spendable quote balance. Alpaca is intentionally
      # excluded while the platform Alpaca account is unfunded.
      - key: PRIMARY_EXECUTION_VENUE
        value: "auto"
      - key: NIJA_BROKER_PRIORITY
        value: "okx,coinbase,kraken"
      - key: NIJA_ENTRY_BROKER_PRIORITY
        value: "okx,coinbase,kraken"
      - key: NIJA_ALLOWED_EXECUTION_BROKERS
        value: "okx,coinbase,kraken"
      - key: NIJA_BROKER_INDEPENDENT_LIVE_EXECUTION
        value: "true"
      - key: NIJA_INDEPENDENT_BROKER_TRADING
        value: "true"
      - key: NIJA_BROKER_SCOPED_POSITION_CAP
        value: "true"

      # Broker-local readiness: an unavailable or quarantined secondary venue
      # blocks only orders routed to that venue. It cannot globally block a
      # healthy Kraken or OKX account. Required venue names remain telemetry.
      - key: NIJA_REQUIRE_SECONDARY_VENUES_READY
        value: "false"
      - key: NIJA_REQUIRED_LIVE_VENUES
        value: "coinbase,okx"
      - key: NIJA_SECONDARY_VENUE_STRICT_RECHECK_S
        value: "2"

      # Coinbase Advanced Trade activation. Consumer-wallet funds remain
      # inaccessible to the Advanced Trade API and are never counted here.
      - key: ENABLE_COINBASE
        value: "true"
      - key: ENABLE_COINBASE_TRADING
        value: "true"
      - key: COINBASE_LIVE_TRADING_ENABLED
        value: "true"
      - key: NIJA_DISABLE_COINBASE
        value: "false"
      - key: COINBASE_MIN_ORDER_USD
        value: "1.00"
      - key: COINBASE_VENUE_THRESHOLD_USD
        value: "12.00"

      # OKX live spot activation. The venue remains excluded until its own
      # credentials, connection, markets, and quote balance are verified.
      - key: ENABLE_OKX
        value: "true"
      - key: ENABLE_OKX_TRADING
        value: "true"
      - key: OKX_LIVE_TRADING_ENABLED
        value: "true"
      - key: NIJA_OKX_EXECUTION_ENABLED
        value: "true"
      - key: NIJA_OKX_LIVE_TRADING_ENABLED
        value: "true"
      - key: NIJA_DISABLE_OKX
        value: "false"
      - key: OKX_MIN_ORDER_USD
        value: "10.00"
      - key: OKX_BASE_URL
        value: "https://us.okx.com"
      - key: OKX_US_REGION
        value: "true"

      # Alpaca platform standby. Credentials remain available for future funding,
      # but the platform broker is not created, registered, position-synced, or
      # eligible for execution while ENABLE_ALPACA=false.
      - key: ENABLE_ALPACA
        value: "false"
      - key: NIJA_ENABLE_ALPACA_PROTECTED_ENTRY
        value: "false"
      - key: ALPACA_MIN_BALANCE_USD
        value: "2.00"

      # Render cold-start convergence. Kraken remains the startup anchor and one
      # fresh authoritative broker is sufficient to initialize the manager.
      - key: NIJA_RUNTIME_AUTHORITY_CONVERGENCE_MIN_BROKERS
        value: "1"
      - key: NIJA_CORE_REGISTRATION_DEADLINE_S
        value: "600"
      - key: NIJA_CORE_REGISTRATION_RESTART_GRACE_S
        value: "15"
      - key: NIJA_RENDER_STARTUP_RECOVERY_ENABLED
        value: "true"
      - key: NIJA_RENDER_STARTUP_RECOVERY_INTERVAL_S
        value: "5"
      - key: NIJA_RENDER_STARTUP_RECOVERY_MAX_ATTEMPTS
        value: "60"
      # Keep the isolated liveness endpoint available while Render-local
      # transient writer/worker exits wait for the old Redis lease to expire.
      # A clean return is unexpected for this continuous service. Clean returns,
      # generic canonical crashes, and known transient exits retry in-process;
      # SIGTERM and other statuses still terminate for platform recovery.
      # No writer, nonce, or execution-authority gate is bypassed.
      - key: NIJA_RENDER_RUNTIME_RECOVERY_MAX_ATTEMPTS
        value: "12"
      - key: NIJA_RENDER_RUNTIME_RECOVERY_DELAY_S
        value: "65"
      - key: NIJA_CAPITAL_WATCHDOG_INTERVAL_S
        value: "5"
      - key: NIJA_CAPITAL_STARTUP_INVARIANT_TIMEOUT_S
        value: "90"
      - key: NIJA_WAIT_PLATFORM_TIMEOUT_S
        value: "90"
      - key: NIJA_POST_LOCK_CAPITAL_MONITOR_SECONDS
        value: "300"

      # Live-mode intent remains an operator-controlled Render secret/setting.
      # Runtime execution authority is deliberately absent: it is derived by the
      # current process only after writer-lock, heartbeat, and capital proof.
      - key: LIVE_TRADING
        sync: false
      - key: LIVE_CAPITAL_VERIFIED
        sync: false

      # Shared only with the isolated billing API so NIJA can mint/verify
      # short-lived billing identity assertions without hardcoding a secret.
      - key: NIJA_BILLING_IDENTITY_SECRET
        generateValue: true

      # Platform broker credentials. Values are entered in Render and never
      # committed to the repository.
      - key: KRAKEN_PLATFORM_API_KEY
        sync: false
      - key: KRAKEN_PLATFORM_API_SECRET
        sync: false
      - key: COINBASE_API_KEY
        sync: false
      - key: COINBASE_API_SECRET
        sync: false
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        sync: false

      # Independent user broker credentials
      - key: KRAKEN_USER_DAIVON_API_KEY
        sync: false
      - key: KRAKEN_USER_DAIVON_API_SECRET
        sync: false

  # Standalone billing service. It is intentionally separated from the trading
  # runtime and deploys only after repository checks pass.
  - type: web
    name: nija-billing-api
    runtime: python
    region: oregon
    plan: free
    repo: https://github.com/dantelrharrell-debug/Nija
    branch: main
    buildCommand: pip install -r requirements-billing.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 billing_service:app
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      # Match repository CI/runtime compatibility; Render otherwise selects
      # the newest Python release, which is not compatible with SQLAlchemy 2.0.25.
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: BILLING_DATABASE_URL
        fromDatabase:
          name: nija-billing-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        fromService:
          type: web
          name: nija-trading-bot
          envVarKey: STRIPE_SECRET_KEY
      - key: NIJA_BILLING_IDENTITY_SECRET
        fromService:
          type: web
          name: nija-trading-bot
          envVarKey: NIJA_BILLING_IDENTITY_SECRET
      - key: NIJA_PUBLIC_SITE_URL
        value: https://nijaaitrading.com
      - key: NIJA_BILLING_ALLOWED_ORIGINS
        value: https://nijaaitrading.com,https://www.nijaaitrading.com

      # Bitcoin checkout is fail-closed until the merchant account and public
      # billing-service origin are explicitly configured. BitPay notifications
      # are reconciled server-side before a payment is marked verified.
      - key: NIJA_BITCOIN_PAYMENTS_ENABLED
        value: "false"
      - key: NIJA_BITCOIN_ENABLED_OFFERS
        value: "lessons"
      - key: NIJA_BITCOIN_ALLOW_RECURRING_ONE_TIME_PAYMENTS
        value: "false"
      - key: NIJA_BITCOIN_TRANSACTION_SPEED
        value: "medium"
      - key: BITPAY_API_BASE_URL
        value: https://bitpay.com
      - key: BITPAY_POS_TOKEN
        sync: false
      # Set this to the billing service's actual deployed HTTPS origin, e.g.
      # https://<actual-billing-host>. It must never point at the old IONOS 404
      # webhook route.
      - key: NIJA_BILLING_PUBLIC_URL
        sync: false
      - key: STRIPE_PRICE_FOUNDING_BETA
        value: price_1U02snI0gfJjTf3ERCCo4usA
      - key: STRIPE_PRODUCT_FOUNDING_BETA
        value: prod_UzyI6ZRgZrT8G6
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        value: https://nijaaitrading.com/beta-success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: https://nijaaitrading.com/apply

  # Durable private-only Redis-compatible datastore for writer fencing, nonce
  # state, heartbeats, and distributed runtime coordination.
  - type: keyvalue
    name: nija-redis
    region: oregon
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "journal-snapshot"
