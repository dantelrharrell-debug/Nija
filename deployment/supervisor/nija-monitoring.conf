[program:nija-status-monitor]
command=/usr/bin/python3 /opt/nija/status_monitor.py
directory=/opt/nija
user=nija
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/nija/status-monitor.log
# Required from supervisord's protected environment; no example-password fallback.
environment=DATABASE_URL="%(ENV_DATABASE_URL)s"
