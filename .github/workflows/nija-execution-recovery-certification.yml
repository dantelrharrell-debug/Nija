name: NIJA execution recovery and independent evidence

on:
  pull_request:
    branches: [main, release/justcall-handoff-only-20261017]
    paths:
      - 'bot/durable_recovery_state.py'
      - 'bot/runtime_kraken_client_order_recovery_v430_patch.py'
      - 'bot/runtime_kraken_deferred_fill_proof_recovery_v363_patch.py'
      - 'bot/tests/test_durable_recovery_state.py'
      - 'bot/tests/test_runtime_kraken_client_order_recovery_v430.py'
      - 'bot/tests/test_runtime_kraken_deferred_fill_proof_recovery_v363.py'
      - 'bot/order_admission_policy.py'
      - 'tests/test_order_admission_policy.py'
      - 'bot/runtime_known_execution_probe_revalidation_v406_patch.py'
      - 'bot/startup_recovery_readonly.py'
      - 'tests/test_kraken*execution*.py'
      - 'tests/test_runtime_known_execution_probe_v406_dynamic.py'
      - 'tests/test_independent_recovery_certification.py'
      - '.github/workflows/nija-execution-recovery-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-recovery-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
      KRAKEN_API_KEY: ''
      KRAKEN_API_SECRET: ''
      COINBASE_API_KEY: ''
      COINBASE_API_SECRET: ''
      OKX_API_KEY: ''
      OKX_API_SECRET: ''
      OKX_PASSPHRASE: ''
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline checks
        run: python -m pip install pytest==8.2.2 detect-secrets==1.5.0
      - name: Compile the repair without production startup hooks
        run: |
          python -S -m py_compile \
            bot/durable_recovery_state.py \
            bot/runtime_kraken_client_order_recovery_v430_patch.py \
            bot/runtime_kraken_deferred_fill_proof_recovery_v363_patch.py \
            bot/tests/test_durable_recovery_state.py \
            bot/tests/test_runtime_kraken_client_order_recovery_v430.py \
            bot/tests/test_runtime_kraken_deferred_fill_proof_recovery_v363.py \
            bot/order_admission_policy.py \
            tests/test_order_admission_policy.py \
            bot/runtime_known_execution_probe_revalidation_v406_patch.py \
            bot/startup_recovery_readonly.py \
            tests/test_kraken_recent_execution_discovery.py \
            tests/test_kraken_execution_recovery_candidates_v406.py \
            tests/test_runtime_known_execution_probe_v406_dynamic.py \
            tests/test_independent_recovery_certification.py
      - name: Scan changed runtime and test files for secrets
        run: |
          python -m detect_secrets scan --all-files --no-verify \
            bot/durable_recovery_state.py \
            bot/runtime_kraken_client_order_recovery_v430_patch.py \
            bot/runtime_kraken_deferred_fill_proof_recovery_v363_patch.py \
            bot/tests/test_durable_recovery_state.py \
            bot/tests/test_runtime_kraken_client_order_recovery_v430.py \
            bot/tests/test_runtime_kraken_deferred_fill_proof_recovery_v363.py \
            bot/order_admission_policy.py \
            tests/test_order_admission_policy.py \
            docs/order-admission-integration-review.md \
            bot/runtime_known_execution_probe_revalidation_v406_patch.py \
            bot/startup_recovery_readonly.py \
            tests/test_kraken_recent_execution_discovery.py \
            tests/test_kraken_execution_recovery_candidates_v406.py \
            tests/test_runtime_known_execution_probe_v406_dynamic.py \
            tests/test_independent_recovery_certification.py \
            .github/workflows/nija-execution-recovery-certification.yml \
            docs/nija_execution_recovery_release_20261020.md > /tmp/recovery-secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('/tmp/recovery-secret-scan.json').read_text())['results']
          if results:
              raise SystemExit('Secret scan findings in: ' + ', '.join(sorted(results)))
          print('Changed-file secret scan passed')
          PY
      - name: Verify execution, independent exits, and ledger invariants offline
        run: |
          python -m pytest -q \
            bot/tests/test_durable_recovery_state.py \
            bot/tests/test_runtime_kraken_client_order_recovery_v430.py \
            bot/tests/test_runtime_kraken_deferred_fill_proof_recovery_v363.py \
            tests/test_order_admission_policy.py \
            tests/test_kraken_recent_execution_discovery.py \
            tests/test_kraken_execution_recovery_candidates_v406.py \
            tests/test_runtime_known_execution_probe_v406_dynamic.py \
            tests/test_independent_recovery_certification.py \
            tests/test_execution_proof_deadlock_crossguards_v451.py \
            tests/test_preactivation_execution_proof_v439.py \
            tests/test_runtime_all_account_position_exit_coverage_v281.py \
            tests/test_v460_protective_coverage_numeric.py \
            bot/tests/test_runtime_kraken_delayed_fill_reconciliation_v357.py \
            bot/tests/test_runtime_execution_position_readiness_v346.py \
            bot/tests/test_startup_verification_preflight.py \
            bot/tests/test_startup_verification_evidence.py \
            bot/tests/test_trade_ledger_storage_v435.py \
            bot/tests/test_trade_ledger_snapshot_v436.py \
            bot/tests/test_nija_ledger_evidence_v438.py \
            bot/tests/test_offhost_ledger_evidence_report_v448.py

  recovery-codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python/recovery-release'
