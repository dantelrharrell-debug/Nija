name: NIJA website leads Apollo CRM recovery tests

on:
  pull_request:
    paths:
      - 'render_lead_intake.py'
      - 'scripts/verify_nija_lead_storage_readonly.py'
      - 'tests/test_verify_nija_lead_storage_readonly.py'
      - 'docs/NIJA_LEAD_STORAGE_RECOVERY_GATE_20261112.md'
      - 'render_lead_crm_sync.py'
      - 'render_apollo_feeder.py'
      - 'scripts/nija_apollo_readonly_probe.py'
      - 'tests/test_nija_apollo_readonly_probe.py'
      - 'tests/test_render_apollo_feeder_quota_cursor.py'
      - 'tests/test_render_lead_crm_sync.py'
      - 'tests/test_lead_forward_idempotency.py'
      - 'tests/test_lead_phone_consent_evidence.py'
      - 'tests/test_lead_intake_review_regressions.py'
      - 'scripts/verify_ionos_lead_intake_offline.mjs'
      - 'tests/fixtures/ionos/leadIntake.preview-20261111.js'
      - '.github/workflows/lead-crm-recovery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'render_lead_intake.py'
      - 'scripts/verify_nija_lead_storage_readonly.py'
      - 'tests/test_verify_nija_lead_storage_readonly.py'
      - 'docs/NIJA_LEAD_STORAGE_RECOVERY_GATE_20261112.md'
      - 'render_lead_crm_sync.py'
      - 'render_apollo_feeder.py'
      - 'scripts/nija_apollo_readonly_probe.py'
      - 'tests/test_nija_apollo_readonly_probe.py'
      - 'tests/test_render_apollo_feeder_quota_cursor.py'
      - 'tests/test_render_lead_crm_sync.py'
      - 'tests/test_lead_forward_idempotency.py'
      - 'tests/test_lead_phone_consent_evidence.py'
      - 'tests/test_lead_intake_review_regressions.py'
      - 'scripts/verify_ionos_lead_intake_offline.mjs'
      - 'tests/fixtures/ionos/leadIntake.preview-20261111.js'
      - '.github/workflows/lead-crm-recovery-ci.yml'

permissions:
  contents: read

jobs:
  lead-crm-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify lead storage fail-closed read-only preflight
        run: python -m unittest discover -s tests -p 'test_verify_nija_lead_storage_readonly.py' -v
      - name: Verify idempotency, response speed, retry and safety
        run: python -m pytest -q tests/test_render_lead_crm_sync.py tests/test_lead_forward_idempotency.py tests/test_lead_phone_consent_evidence.py tests/test_lead_intake_review_regressions.py tests/test_nija_apollo_readonly_probe.py tests/test_render_apollo_feeder_quota_cursor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exported IONOS intake without network or providers
        run: node --experimental-vm-modules scripts/verify_ionos_lead_intake_offline.mjs
