name: NIJA pinned Kraken receipt metadata proof (read-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [release/justcall-handoff-only-20261017]
    paths:
      - '.github/workflows/nija-kraken-receipt-metadata-proof-20261029.yml'
permissions:
  contents: read
jobs:
  receipt-metadata:
    if: >-
      github.event.pull_request.number == 3499 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/nija-independent-recovery-20261029' &&
      github.event.pull_request.base.ref == 'release/justcall-handoff-only-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing failed receipts via pinned production SSH (no API, no writes)
        shell: bash
        env:
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [ -z "${RENDER_RECOVERY_SSH_KEY:-}" ]; then
            echo 'STOP=RECOVERY_SSH_SECRET_MISSING'
            exit 2
          fi
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$RENDER_RECOVERY_SSH_KEY" > "$scratch/key"
          unset RENDER_RECOVERY_SSH_KEY
          chmod 600 "$scratch/key"
          ssh-keygen -y -P '' -f "$scratch/key" > /dev/null 2>&1 || {
            echo 'STOP=INVALID_RECOVERY_SSH_KEY'
            exit 2
          }
          ssh-keyscan -t ed25519 -T 15 ssh.oregon.render.com > "$scratch/known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$scratch/known_hosts" -E sha256 | awk '{print $2}' | sort -u)"
          test "$fingerprint" = 'SHA256:KkZPgnApmttFYSkdJsCi7B01sgZPMI6kY53MDbbanGM' || {
            echo 'STOP=RENDER_SSH_HOST_FINGERPRINT_MISMATCH'
            exit 2
          }
          ssh -T -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o IdentityAgent=none -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$scratch/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com \
            'python -B -S -' <<'PY'
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          import stat
          import sys
          if os.environ.get("RENDER_SERVICE_ID") != "srv-d98dsr5aeets73fpbaqg":
              raise SystemExit("STOP=SERVICE_ID_MISMATCH")
          if os.environ.get("RENDER_GIT_COMMIT") != "37cf08a504a0ea31401aefbdd3aa71d13e943b5d":
              raise SystemExit("STOP=PRODUCTION_COMMIT_CHANGED")
          print("PINNED_SERVICE_AND_COMMIT=PASS", flush=True)
          script = Path("/app/scripts/nija_kraken_failure_receipt_triage_v464.py")
          if script.is_symlink() or not script.is_file():
              raise SystemExit("STOP=TRIAGE_SCRIPT_MISSING")
          source = script.read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(source)).encode() + b"\0" + source).hexdigest()
          if blob != "28f5c2ce315866e96e00548fbceef3352684678c":
              raise SystemExit("STOP=TRIAGE_SCRIPT_PIN_MISMATCH")
          print("REVIEWED_TRIAGE_SCRIPT=PASS", flush=True)
          directory = os.environ.get("NIJA_KRAKEN_HISTORY_RECOVERY_DIR", "")
          if not directory:
              raise SystemExit("STOP=RECOVERY_DIR_ENV_MISSING")
          root = Path(directory)
          try:
              info = root.lstat()
              canonical = root.is_absolute() and not stat.S_ISLNK(info.st_mode) and root.resolve(strict=True) == root
              private = (stat.S_ISDIR(info.st_mode) and info.st_uid == os.geteuid()
                         and stat.S_IMODE(info.st_mode) & 0o077 == 0)
          except (OSError, RuntimeError):
              canonical = private = False
          if not canonical or not private:
              raise SystemExit("STOP=RECOVERY_DIR_NOT_PRIVATE_OR_CANONICAL")
          print("RECOVERY_DIR_PRIVATE_CANONICAL=PASS", flush=True)
          spec = importlib.util.spec_from_file_location("nija_pinned_receipt_triage", str(script))
          if spec is None or spec.loader is None:
              raise SystemExit("STOP=TRIAGE_IMPORT_UNAVAILABLE")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          requests = [
              ("INITIAL_HISTORY", "91cefe76c2c7d7164608bb4ffb195532"),
              ("CURSOR_HISTORY", "d7baa71731e633d1c6f4c9848505ab98"),
              ("OFFSET_PAGE_BUDGET", "97dbb6dc01e97936829e0e3656fdbcf1"),
              ("OPEN_ORDERS", "aec7c56e2aa9cff292f1f6ffe94829d4"),
          ]
          success = 0
          for label, request_id in requests:
              # No paths, IDs, balances, orders or raw records in output.
              try:
                  result = module.inspect_failure(root, request_id)
                  print("CASE_" + label + "=VALID_FAILED_RECEIPT:" +
                        str(result["failure_code"]), flush=True)
                  success += 1
              except module.TriageFailure as exc:
                  # Review script raises only fixed, non-sensitive error codes.
                  allowed = {
                      "duplicate_json_key", "nonfinite_json_value", "unsafe_receipt_file",
                      "receipt_missing_or_unreadable", "receipt_changed_or_oversized",
                      "invalid_receipt_json", "invalid_receipt_schema",
                      "unsafe_recovery_directory", "claim_schema_or_scope_invalid",
                      "receipt_identity_or_outcome_invalid", "receipt_failure_label_invalid",
                      "receipt_contains_unexpected_fields", "receipt_api_failure_reason_invalid",
                      "page_budget_claim_mismatch", "invalid_request_id",
                  }
                  reason = str(exc)
                  print("CASE_" + label + "=" +
                        (reason if reason in allowed else "UNCLASSIFIED"), flush=True)
              except Exception:
                  print("CASE_" + label + "=UNEXPECTED_ERROR", flush=True)
          print("VALID_FAILED_RECEIPT_PAIRS=" + str(success), flush=True)
          print("BROKER_REQUESTS_PERFORMED=false", flush=True)
          print("LEDGER_WRITES_PERFORMED=false", flush=True)
          print("TRADING_AUTHORIZED=false", flush=True)
          if success == 0:
              raise SystemExit("STOP=NO_VERIFIABLE_FAILED_RECEIPTS")
          PY
