name: JustCall Handoff Audit Regression
on:
  push:
    paths:
      - 'render_justcall_handoff_audit.py'
      - 'render_outreach_autodial.py'
      - 'tests/test_justcall_handoff_audit.py'
      - '.github/workflows/justcall-handoff-audit-tests.yml'
  pull_request:
    paths:
      - 'render_justcall_handoff_audit.py'
      - 'render_outreach_autodial.py'
      - 'tests/test_justcall_handoff_audit.py'
      - '.github/workflows/justcall-handoff-audit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run fail-closed handoff audit tests
        run: python -m pytest -q tests/test_justcall_handoff_audit.py tests/test_justcall_campaign_route_safety.py
