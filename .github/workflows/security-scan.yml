name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, release/justcall-handoff-only-20261017 ]
  schedule:
    # Run security scan weekly on Sundays at 2am UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit==2.10.1

    - name: Audit resolved dependencies
      run: |
        pip install -r requirements.txt
        pip-audit --desc --format json --output dependency-report.json

    - name: Upload dependency report
      uses: actions/upload-artifact@v4.4.3
      if: always()
      with:
        name: dependency-report
        path: dependency-report.json

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Scan the checked-out PR head against the merge-base. This avoids the
    # action's stale event-range selection after a PR branch is rebased.
    - name: Verify PR scan history
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
        git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"

    - name: Gitleaks Secret Scan (with config)
      if: github.event_name != 'pull_request'
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for Gitleaks Enterprise

    - name: Gitleaks Secret Scan (PR diff, pinned revisions)
      if: github.event_name == 'pull_request'
      run: |
        set -eu
        GITLEAKS_VERSION=8.24.3
        curl --fail --location --silent --show-error \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        base="${{ github.event.pull_request.base.sha }}"
        head="${{ github.event.pull_request.head.sha }}"
        merge_base="$(git merge-base "$base" "$head")"
        test -n "$merge_base"
        /tmp/gitleaks git --redact --config .gitleaks.toml --exit-code 2 \
          --log-opts="$merge_base..$head" .
        echo "Gitleaks verified PR commit range: $merge_base..$head"

    - name: TruffleHog Secret Scan (Pull Request)
      if: github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}
        extra_args: --debug --only-verified

    - name: TruffleHog Secret Scan (Push - Diff)
      # Only scan diff when github.event.before is valid (not the Git null SHA)
      # The null SHA (all zeros) indicates a new branch or initial commit
      if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.before }}
        head: ${{ github.sha }}
        extra_args: --debug --only-verified

    - name: TruffleHog Secret Scan (Push - Full Scan for New Branch)
      # Full scan when github.event.before is the Git null SHA (new branch/initial commit)
      if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

    - name: TruffleHog Secret Scan (Scheduled/Full Scan)
      if: github.event_name == 'schedule'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

    - name: Set up Python for detect-secrets
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate baseline reporting regressions
      run: |
        set -euo pipefail
        pip install 'detect-secrets==1.5.0' 'pytest==8.2.2'
        NIJA_DEFER_RUNTIME_SITE_HOOKS=1 python -m pytest -q tests/test_baseline_secret_scan_reporting.py

    - name: Enforce baseline-aware scanning
      run: |
        set -euo pipefail
        detect-secrets --version
        python scripts/run_baseline_secret_scan.py --report secret-scan-report.json

    - name: Retain value-free secret scan evidence
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
        name: secret-scan-report
        path: secret-scan-report.json
        if-no-files-found: error
        retention-days: 7

  bandit-scan:
    name: Python Security Linting (Bandit)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]

    - name: Run Bandit security scan
      run: |
        bandit -r . -lll -iii -f json -o bandit-report.json --exclude ./archive,./venv,./mobile,./frontend

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4.4.3
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  pre-commit-checks:
    name: Pre-Commit Hook Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit on all files
      run: |
        pre-commit run --all-files --show-diff-on-failure
      continue-on-error: true

    - name: Generate pre-commit report
      if: always()
      run: |
        echo "Pre-commit validation complete" > pre-commit-report.txt
        echo "Run 'pre-commit run --all-files' locally to see detailed results" >> pre-commit-report.txt

    - name: Upload pre-commit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pre-commit-report
        path: pre-commit-report.txt
