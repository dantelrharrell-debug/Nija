name: Security Scanning

on:
  push:
    branches: [ main, develop, release/justcall-handoff-only-20261017 ]
  pull_request:
    branches: [ main, release/justcall-handoff-only-20261017 ]
  schedule:
    # Run security scan weekly on Sundays at 2am UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit==2.10.1

    - name: Audit resolved dependencies
      run: |
        pip install -r requirements.txt
        pip-audit --desc --format json --output dependency-report.json

    - name: Verify Tornado redirect security and compatibility offline
      env:
        NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
      run: |
        tornado_requirement="$(grep -E '^tornado==[^[:space:]]+$' requirements-notebook.txt)"
        python -m pip install "$tornado_requirement"
        python -m tornado.test.runtests tornado.test.web_test.RedirectHandlerTest

    - name: Upload dependency report
      uses: actions/upload-artifact@v4.4.3
      if: always()
      with:
        name: dependency-report
        path: dependency-report.json

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Scan the checked-out PR head against the merge-base. This avoids the
    # action's stale event-range selection after a PR branch is rebased.
    - name: Verify PR scan history
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}"
        git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"

    - name: Gitleaks Secret Scan (with config)
      if: github.event_name != 'pull_request'
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for Gitleaks Enterprise

    - name: Gitleaks Secret Scan (PR diff, pinned revisions)
      if: github.event_name == 'pull_request'
      run: |
        set -eu
        GITLEAKS_VERSION=8.24.3
        # Publisher checksum for the exact Linux x64 archive in the v8.24.3 release.
        GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        curl --fail --location --silent --show-error \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o /tmp/gitleaks.tar.gz
        printf '%s  %s\n' "$GITLEAKS_SHA256" /tmp/gitleaks.tar.gz | sha256sum --check --strict
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        base="${{ github.event.pull_request.base.sha }}"
        head="${{ github.event.pull_request.head.sha }}"
        merge_base="$(git merge-base "$base" "$head")"
        test -n "$merge_base"
        # Retain the same failing exit code, but reveal ONLY value-free
        # review coordinates to distinguish a real credential from a fixture.
        set +e
        /tmp/gitleaks git --redact --config .gitleaks.toml --exit-code 2 \
          --report-format json --report-path "$RUNNER_TEMP/nija-gitleaks-review.json" \
          --log-opts="$merge_base..$head" .
        gitleaks_status=$?
        set -e
        if test -s "$RUNNER_TEMP/nija-gitleaks-review.json"; then
          python - <<'PY'
        import json, os
        from pathlib import Path
        p = Path(os.environ["RUNNER_TEMP"]) / "nija-gitleaks-review.json"
        entries = json.loads(p.read_text(encoding="utf-8"))
        for x in entries:
            # Never log Secret, Match, entropy, fingerprints or commit contents.
            print("Gitleaks review coordinate:",
                  {"file": x.get("File"), "line": x.get("StartLine"),
                   "rule": x.get("RuleID")})
        PY
        fi
        if test "$gitleaks_status" -ne 0; then
          echo "Gitleaks remains a blocking security check"
          exit "$gitleaks_status"
        fi
        echo "Gitleaks verified PR commit range: $merge_base..$head"

    - name: TruffleHog Secret Scan (Pull Request)
      if: github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.pull_request.base.sha }}
        head: ${{ github.event.pull_request.head.sha }}
        extra_args: --debug --only-verified

    - name: TruffleHog Secret Scan (Push - Diff)
      # Only scan diff when github.event.before is valid (not the Git null SHA)
      # The null SHA (all zeros) indicates a new branch or initial commit
      if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.before }}
        head: ${{ github.sha }}
        extra_args: --debug --only-verified

    - name: TruffleHog Secret Scan (Push - Full Scan for New Branch)
      # Full scan when github.event.before is the Git null SHA (new branch/initial commit)
      if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

    - name: TruffleHog Secret Scan (Scheduled/Full Scan)
      if: github.event_name == 'schedule'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --debug --only-verified

    - name: Set up Python for detect-secrets
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate baseline reporting regressions
      run: |
        set -euo pipefail
        pip install 'detect-secrets==1.5.0' 'pytest==8.2.2' 'PyYAML==6.0.3'
        NIJA_DEFER_RUNTIME_SITE_HOOKS=1 python -m pytest -q \
          tests/test_baseline_secret_scan_reporting.py \
          tests/test_verified_synthetic_fixture_baseline.py \
          tests/test_exact_source_secret_review.py \
          tests/test_precommit_trufflehog_enforcement.py \
          tests/test_guarddog_report_enforcement.py \
          tests/test_precommit_validation_report.py \
          tests/test_analysis_report_integrity.py \
          tests/test_profit_optimization_env_template_guard.py

    - name: Enforce baseline-aware scanning
      # Preserve a value-free report even when regression/setup steps fail.
      # The wrapper verifies its pinned scanner version and writes a failing
      # scanner_error report if dependencies are unavailable. Previous failed
      # steps remain failures; this step never makes them successful.
      if: always()
      run: |
        set -euo pipefail
        python scripts/run_baseline_secret_scan.py --report secret-scan-report.json

    - name: Retain value-free secret scan evidence
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
        name: secret-scan-report
        path: secret-scan-report.json
        if-no-files-found: error
        retention-days: 7

  bandit-scan:
    name: Python Security Linting (Bandit)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]

    - name: Run Bandit security scan
      run: |
        bandit -r . -lll -iii -f json -o bandit-report.json --exclude ./archive,./venv,./mobile,./frontend

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4.4.3
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  pre-commit-checks:
    name: Pre-Commit Hook Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # The pinned Go-based hooks predate Go 1.25 and use an x/tools
    # tokeninternal layout assertion incompatible with the runner default.
    # Keep this toolchain isolated to CI hooks; it is not a runtime pin.
    - name: Set up compatible Go for existing hooks
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: false

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit 'pytest==8.2.2' 'PyYAML==6.0.3'

    - name: Verify isolated Bandit hook can scan and reject unsafe code
      run: python -m pytest -q tests/test_bandit_hook_bootstrap.py

    # A hook initialization or detection failure must fail the job.
    - name: Test pre-commit enforcement diagnostics
      run: python -S -m unittest discover -s tests -p 'test_precommit_validation_report.py' -v

    - name: Verify balance diagnostic credential redaction without broker access
      run: python -S -m unittest discover -s tests -p 'test_balance_diagnostic_redaction.py' -v

    - name: Run pre-commit on all files
      id: precommit
      run: python -S scripts/run_precommit_validation.py --report pre-commit-report.json

    - name: Upload pre-commit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pre-commit-report
        path: pre-commit-report.json
        if-no-files-found: error
