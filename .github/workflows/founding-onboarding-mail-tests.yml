name: Founding 100 onboarding mail
on:
  pull_request:
    paths:
      - 'founding_onboarding_mail.py'
      - 'founding_onboarding_api.py'
      - 'billing_service.py'
      - 'requirements-billing.txt'
      - 'tests/test_founding_onboarding_*.py'
      - '.github/workflows/founding-onboarding-mail-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test invitation safety and deduplication
        env:
          NIJA_DEFER_RUNTIME_SITE_HOOKS: "1"
        run: |
          pip install -r requirements-billing.txt
          python -m unittest discover -s tests -p 'test_founding_onboarding_*.py' -v
