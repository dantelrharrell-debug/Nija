name: Render recovery access (read-only)
on:
  workflow_dispatch:
  push:
    branches: [ops/render-recovery-runner-20261029]
    paths: ['.github/workflows/render-recovery-access.yml']
permissions:
  contents: read
concurrency:
  group: render-recovery-access
  cancel-in-progress: false
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check regional SSH network path without credentials
        shell: bash
        run: |
          python3 -I - <<'PY'
          import socket
          host = 'ssh.oregon.render.com'
          try:
              socket.getaddrinfo(host, 22, type=socket.SOCK_STREAM)
          except OSError:
              raise SystemExit('BLOCKED: regional SSH hostname did not resolve')
          print('RENDER_SSH_DNS_OK')
          try:
              with socket.create_connection((host, 22), timeout=15):
                  pass
          except OSError:
              raise SystemExit('BLOCKED: regional SSH TCP connection failed')
          print('RENDER_SSH_TCP_OK')
          PY
  authenticated-access:
    needs: network
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect fixed read-only production preflight
        shell: bash
        env:
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$RENDER_RECOVERY_SSH_KEY" ]; then
            echo 'BLOCKED: configure NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY and register its public key in Render'
            exit 2
          fi
          umask 077
          recovery_dir=$(mktemp -d)
          trap 'rm -rf "$recovery_dir"' EXIT
          printf '%s\n' "$RENDER_RECOVERY_SSH_KEY" > "$recovery_dir/key"
          unset RENDER_RECOVERY_SSH_KEY
          ssh-keygen -y -P '' -f "$recovery_dir/key" >/dev/null 2>&1 || {
            echo 'BLOCKED: dedicated SSH key is invalid or requires interactive unlocking'
            exit 2
          }
          ssh-keyscan -t ed25519 -T 15 ssh.oregon.render.com > "$recovery_dir/known_hosts" 2>/dev/null
          observed=$(ssh-keygen -lf "$recovery_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [ "$observed" != 'SHA256:KkZPgnApmttFYSkdJsCi7B01sgZPMI6kY53MDbbanGM' ]; then
            echo 'BLOCKED: Render Oregon host key does not match its published fingerprint'
            exit 2
          fi
          ssh -T -i "$recovery_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$recovery_dir/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
            srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com \
            'command python -S -' <<'PY'
          import fcntl
          import hashlib
          import json
          import os
          import runpy
          import stat
          import tempfile
          import time
          from pathlib import Path

          source = Path('/app/bot/kraken_sqlite_readonly_preflight_v488.py')
          expected = '480e01a7ee4326ee9fc85b202f0fafb413f733cd035d9d957142488d69a05452'
          if source.is_symlink() or hashlib.sha256(source.read_bytes()).hexdigest() != expected:
              raise SystemExit('BLOCKED: reviewed production preflight source changed')
          namespace = runpy.run_path(str(source), run_name='_readonly_preflight')
          report = namespace['inspect_kraken_ledger'](Path('/data/trade_ledger.db'))
          # Only fixed technical issue labels leave the service. Never emit
          # database rows, counters, broker holdings, credentials or identifiers.
          allowed = {
              'persistent_ledger_path_unverified', 'sqlite_integrity_unverified',
              'ledger_audit_row_budget_exceeded', 'open_position_entry_basis_unverified',
              'opening_ledger_order_links_unverified', 'exchange_protective_order_id_mapping_missing',
              'exchange_protective_order_ids_unverified', 'pending_kraken_closes_require_reconciliation',
              'ledger_changed_during_readonly_audit', 'readonly_ledger_query_failed',
          }
          tables = {'trade_ledger', 'open_positions', 'completed_trades',
                    'strategy_order_intents', 'pending_kraken_closes'}
          allowed.update('required_table_or_columns_missing:' + name for name in tables)
          issues = report.get('issues')
          if not isinstance(issues, list) or any(item not in allowed for item in issues):
              raise SystemExit('BLOCKED: unexpected preflight diagnostic shape')
          print('NIJA_SHELL_ACCESS_VERIFIED')
          print(json.dumps({
              'sqlite_integrity_ok': report.get('sqlite_integrity_ok') is True,
              'issues': issues,
              'collector_install_allowed': False,
              'ledger_state_changed': False,
              'financial_data_logged': False,
          }, sort_keys=True))
          if report.get('sqlite_integrity_ok') is not True:
              raise SystemExit('BLOCKED: ledger integrity required before history request')
          collector_source = Path('/app/bot/kraken_live_history_recovery.py')
          collector_hash = '0e04bf20802abde51f78c4ecbf14cbd57cb4a881833760942c4460cfdc9d6a31'
          if (collector_source.is_symlink()
                  or hashlib.sha256(collector_source.read_bytes()).hexdigest() != collector_hash):
              raise SystemExit('BLOCKED: reviewed history request implementation changed')
          exit_source = Path('/app/bot/universal_broker_exit_supervisor_patch.py')
          exit_hash = '7970751561b5dfa6dde1542903289c4351ba15c47b84a7ab315abe39c3aa1758'
          if (exit_source.is_symlink()
                  or hashlib.sha256(exit_source.read_bytes()).hexdigest() != exit_hash):
              raise SystemExit('BLOCKED: reviewed exit observer implementation changed')
          print('NIJA_REPAIR_SOURCE_HASHES_VERIFIED')
          root = Path('/data/kraken-history-recovery')
          if root.is_symlink() or root.resolve() != root:
              raise SystemExit('BLOCKED: recovery path not canonical')
          info = root.stat()
          if (not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid()
                  or stat.S_IMODE(info.st_mode) & 0o077):
              raise SystemExit('BLOCKED: recovery directory not private')
          # One immutable request ID: rerunning this workflow never replays an
          # interrupted claim or submits another history collection.
          # Explicit bounded compatibility probe after the approved deployment.
          # Preserve the interrupted full-history claim; do not replay its ID.
          prior = root / '997eae3f9df551e06ffab7a9cf0dc60d.claimed.json'
          if not prior.is_file() or prior.is_symlink():
              raise SystemExit('BLOCKED: prior history claim must remain preserved')
          print('NIJA_PRIOR_HISTORY_CLAIM_PRESERVED')
          # Operator-selected legacy probe after the terminal cursor failure;
          # this is not automatic fallback and never replays the failed ID.
          cursor_receipt = root / 'd7baa71731e633d1c6f4c9848505ab98.evidence.json'
          if (cursor_receipt.is_symlink() or not cursor_receipt.is_file()
                  or cursor_receipt.stat().st_uid != os.geteuid()
                  or stat.S_IMODE(cursor_receipt.stat().st_mode) & 0o077
                  or cursor_receipt.stat().st_size > 8192):
              raise SystemExit('BLOCKED: preserved terminal cursor failure required')
          failure = json.loads(cursor_receipt.read_text())
          if any(failure.get(key) != value for key, value in {
                  'request_id': 'd7baa71731e633d1c6f4c9848505ab98',
                  'collection_succeeded': False, 'trading_authorized': False,
                  'error_code': 'api_failure', 'error_endpoint': 'TradesHistory',
                  'api_failure_reason': 'invalid_arguments',
          }.items()):
              raise SystemExit('BLOCKED: expected terminal cursor diagnostic missing')
          # Explicit full-history request after the bounded offset read passed
          # the API boundary and stopped at its deliberate one-page budget.
          offset_receipt = root / '97dbb6dc01e97936829e0e3656fdbcf1.evidence.json'
          if (offset_receipt.is_symlink() or not offset_receipt.is_file()
                  or offset_receipt.stat().st_uid != os.geteuid()
                  or stat.S_IMODE(offset_receipt.stat().st_mode) & 0o077
                  or offset_receipt.stat().st_size > 8192):
              raise SystemExit('BLOCKED: terminal bounded offset receipt required')
          bounded = json.loads(offset_receipt.read_text())
          if (any(bounded.get(key) != value for key, value in {
                  'request_id': '97dbb6dc01e97936829e0e3656fdbcf1',
                  'collection_succeeded': False, 'trading_authorized': False,
                  'error_code': 'page_limit', 'error_endpoint': 'TradesHistory',
          }.items()) or type(bounded.get('requested_pages')) is not int
                  or bounded['requested_pages'] != 1
                  or type(bounded.get('required_pages')) is not int
                  or not 1 < bounded['required_pages'] <= 100):
              raise SystemExit('BLOCKED: offset compatibility or approved page budget unproven')
          request_id = 'aec7c56e2aa9cff292f1f6ffe94829d4'
          claim = root / (request_id + '.claimed.json')
          receipt = root / (request_id + '.evidence.json')
          if receipt.exists():
              if receipt.is_symlink() or stat.S_IMODE(receipt.stat().st_mode) & 0o077:
                  raise SystemExit('BLOCKED: history receipt not private')
              row = json.loads(receipt.read_text())
              if (row.get('request_id') != request_id
                      or type(row.get('collection_succeeded')) is not bool
                      or row.get('trading_authorized') is not False):
                  raise SystemExit('BLOCKED: probe receipt identity or outcome invalid')
              state = 'completed' if row['collection_succeeded'] else 'failed'
              print('NIJA_HISTORY_RECOVERY_' + state.upper())
              safe_codes = {
                  'api_failure', 'malformed_result', 'invalid_count', 'invalid_cursor',
                  'repeated_cursor', 'oversized_page', 'duplicate_record', 'invalid_record',
                  'non_json_record', 'empty_page_before_completion', 'page_limit',
                  'pagination_count_changed', 'record_count_mismatch', 'invalid_amount',
                  'invalid_balance', 'invalid_observation_clock', 'repeat_history_changed',
                  'balance_changed', 'open_orders_changed', 'history_incomplete_unknown',
              }
              safe_endpoints = {'Balance', 'TradesHistory', 'ClosedOrders', 'Ledgers', 'OpenOrders', 'history'}
              safe_reasons = {
                  'permission_denied', 'invalid_key', 'invalid_signature', 'invalid_nonce',
                  'rate_limited', 'temporary_lockout', 'invalid_arguments', 'service_unavailable',
                  'deadline_elapsed', 'account_disabled', 'account_unconfirmed', 'throttled',
                  'unknown_api_error', 'malformed_api_response', 'multiple_api_errors',
              }
              reason = row.get('api_failure_reason')
              print(json.dumps({
                  'history_api_failure_reason': reason if type(reason) is str and reason in safe_reasons else 'not_available',
                  'history_error_code': row.get('error_code') if row.get('error_code') in safe_codes else 'unspecified',
                  'history_error_endpoint': row.get('error_endpoint') if row.get('error_endpoint') in safe_endpoints else 'unspecified',
              }, sort_keys=True))
          elif claim.exists():
              fd = os.open(root / 'collector.lock', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  info = os.fstat(fd)
                  if (not stat.S_ISREG(info.st_mode) or info.st_uid != os.geteuid()
                          or stat.S_IMODE(info.st_mode) & 0o077 or info.st_nlink != 1):
                      raise SystemExit('BLOCKED: recovery lock not private regular file')
                  try:
                      fcntl.flock(fd, fcntl.LOCK_SH | fcntl.LOCK_NB)
                  except BlockingIOError:
                      print('NIJA_HISTORY_RECOVERY_CLAIMED_COLLECTOR_LOCK_BUSY')
                  else:
                      print('NIJA_HISTORY_RECOVERY_CLAIMED_COLLECTOR_LOCK_FREE')
              finally:
                  os.close(fd)
          elif (root / 'request.json').exists():
              print('NIJA_HISTORY_RECOVERY_REQUEST_ALREADY_PENDING')
          else:
              # A recovery access check must not create a new broker-history
              # request. Any future collection needs its own separately
              # reviewed and explicitly authorized workflow and request ID.
              raise SystemExit('BLOCKED: no existing history request or receipt; no automatic submission')
          PY
