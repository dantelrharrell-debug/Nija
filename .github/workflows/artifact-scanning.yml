name: Artifact Scanning

on:
  push:
    branches: [ main, develop, release/justcall-handoff-only-20261017 ]
  pull_request:
    branches: [ main, release/justcall-handoff-only-20261017 ]
  schedule:
    # Run weekly on Mondays at 3am UTC
    - cron: '0 3 * * 1'

jobs:
  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      # Keep scanning other images if one fails; never hide failing checks.
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.api, Dockerfile.dashboard, Dockerfile.gateway]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install checksum-pinned Trivy
      run: bash scripts/install_pinned_trivy.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract image name from dockerfile
      id: image-name
      run: |
        DOCKERFILE="${{ matrix.dockerfile }}"
        if [ "$DOCKERFILE" = "Dockerfile" ]; then
          echo "image=nija:latest" >> $GITHUB_OUTPUT
        else
          SUFFIX=$(echo $DOCKERFILE | sed 's/Dockerfile\.//')
          echo "image=nija-${SUFFIX}:latest" >> $GITHUB_OUTPUT
        fi

    - name: Build Docker image
      id: build-image
      run: |
        set -euo pipefail
        # Dockerfiles do not accept GH_TOKEN; never pass GitHub secrets as build args.
        # Use Docker Hub to avoid ECR Public rate limits.
        # A failed pull still fails this job; scanners remain mandatory.
        docker buildx build --load --no-cache --progress=plain \
          --metadata-file "$RUNNER_TEMP/nija-container-build.json" \
          --build-arg PYTHON_BASE=python:3.11-slim-trixie@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535 \
          -f ${{ matrix.dockerfile }} \
          -t ${{ steps.image-name.outputs.image }} \
          . 2>&1 | tee "$RUNNER_TEMP/nija-container-build.log"

    - name: Record the local image selected for scanning
      id: scan-target
      env:
        IMAGE: ${{ steps.image-name.outputs.image }}
        DOCKERFILE: ${{ matrix.dockerfile }}
      run: |
        set -euo pipefail
        image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
        [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
        metadata="$RUNNER_TEMP/nija-container-build.json"
        config_digest=$(jq -r '."containerimage.config.digest" // empty' "$metadata")
        manifest_digest=$(jq -r '."containerimage.digest" // empty' "$metadata")
        # The Docker archive exporter can omit digests from the metadata file.
        # Plain export records may include an elapsed duration before 'done'.
        build_log="$RUNNER_TEMP/nija-container-build.log"
        if [[ -z "$config_digest" ]]; then
          config_digest=$(sed -En 's/^#[0-9]+ exporting config (sha256:[0-9a-f]{64})( [0-9]+([.][0-9]+)?s)? done$/\1/p' "$build_log" | sort -u)
        fi
        if [[ -z "$manifest_digest" ]]; then
          manifest_digest=$(sed -En 's/^#[0-9]+ exporting manifest (sha256:[0-9a-f]{64})( [0-9]+([.][0-9]+)?s)? done$/\1/p' "$build_log" | sort -u)
        fi
        [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        # Legacy Docker identifies images by config; the containerd store
        # identifies them by the OCI target exported by Buildx.
        case "$image_id" in
          "$config_digest") image_id_kind=config ;;
          "$manifest_digest") image_id_kind=export_target ;;
          *)
            echo "Local image ID does not match either immutable Buildx digest" >&2
            exit 1
            ;;
        esac
        commit=$(git rev-parse HEAD)
        printf 'id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
        printf 'commit=%s\ndockerfile=%s\nlocal_image_id=%s\nlocal_image_id_kind=%s\nbuild_config_digest=%s\nbuild_manifest_digest=%s\n' \
          "$commit" "$DOCKERFILE" "$image_id" "$image_id_kind" "$config_digest" "$manifest_digest" > container-scan-target.txt

    - name: Run Trivy vulnerability scanner
      run: |
        bash scripts/run_trivy_scan.sh image \
          --image-src docker \
          --format sarif \
          --output "trivy-results-${{ matrix.dockerfile }}.sarif" \
          --severity CRITICAL,HIGH \
          "${{ steps.scan-target.outputs.id }}"

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: ${{ always() && hashFiles(format('trivy-results-{0}.sarif', matrix.dockerfile)) != '' }}
      with:
        sarif_file: 'trivy-results-${{ matrix.dockerfile }}.sarif'
        category: 'trivy-${{ matrix.dockerfile }}'

    - name: Run Trivy vulnerability scanner (table format)
      if: ${{ !cancelled() && steps.scan-target.outcome == 'success' }}
      run: |
        bash scripts/run_trivy_scan.sh image \
          --image-src docker \
          --format table \
          --severity CRITICAL,HIGH \
          "${{ steps.scan-target.outputs.id }}"

    # Refresh the Grype scanner: v3 bundled an obsolete 0.74.4 release whose
    # stale vulnerability database caused scans to error. Keep DB age checks on.
    - name: Run Grype vulnerability scanner
      if: ${{ !cancelled() && steps.scan-target.outcome == 'success' }}
      uses: anchore/scan-action@v7.4.0
      id: grype-scan
      with:
        image: docker:${{ steps.scan-target.outputs.id }}
        fail-build: true
        severity-cutoff: high
        cache-db: false

    # Operational failures and HIGH/CRITICAL findings are both hard errors.
    - name: Validate Grype scan output
      if: always() && steps.grype-scan.outputs.sarif != ''
      env:
        GRYPE_SARIF: ${{ steps.grype-scan.outputs.sarif }}
      run: |
        set -euo pipefail
        test -n "$GRYPE_SARIF" && test -s "$GRYPE_SARIF"
        python -m json.tool "$GRYPE_SARIF" > /dev/null

    - name: Upload Grype scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && steps.grype-scan.outputs.sarif != ''
      with:
        sarif_file: ${{ steps.grype-scan.outputs.sarif }}
        category: 'grype-${{ matrix.dockerfile }}'

    - name: Verify Kraken inventory source and record Linux package artifacts from the scanned trading image
      if: ${{ !cancelled() && steps.scan-target.outcome == 'success' && matrix.dockerfile == 'Dockerfile' }}
      env:
        SCAN_IMAGE_ID: ${{ steps.scan-target.outputs.id }}
      run: |
        set -euo pipefail
        source_path=bot/kraken_current_inventory.py
        workdir=$(mktemp -d)
        container_id=
        cleanup() {
          if [[ -n "$container_id" ]]; then
            docker rm "$container_id" >/dev/null
          fi
          rm -rf "$workdir"
        }
        trap cleanup EXIT
        git show "HEAD:$source_path" > "$workdir/reviewed.py"
        container_id=$(docker create --network none --entrypoint /bin/false "$SCAN_IMAGE_ID")
        docker cp "$container_id:/app/$source_path" "$workdir/image.py"
        test -f "$workdir/image.py" && test ! -L "$workdir/image.py"
        cmp "$workdir/reviewed.py" "$workdir/image.py"
        read -r source_digest _ < <(sha256sum "$workdir/image.py")
        printf 'kraken_inventory_source_sha256=%s\n' "$source_digest" >> container-scan-target.txt
        docker cp "$container_id:/opt/nija-pip-install.json" "$workdir/pip-install.json"
        test -f "$workdir/pip-install.json"
        test ! -L "$workdir/pip-install.json"
        python3 -I -S - "$workdir/pip-install.json" <<'PYTHON'
        import json
        import re
        import sys
        from pathlib import Path
        from urllib.parse import urlsplit

        report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        if report.get("version") != "1" or not report.get("install"):
            raise SystemExit("pip artifact evidence is empty or unsupported")
        records = []
        seen = set()
        for item in report["install"]:
            name = item["metadata"]["name"]
            version = item["metadata"]["version"]
            download = item["download_info"]
            url = urlsplit(download.get("url", ""))
            archive = download.get("archive_info", {})
            digest = archive.get("hashes", {}).get("sha256", "")
            filename = url.path.rsplit("/", 1)[-1]
            identity = re.sub(r"[-_.]+", "-", name).lower()
            if (
                identity in seen or item.get("is_yanked") is not False
                or url.scheme != "https" or url.netloc != "files.pythonhosted.org"
                or url.query or url.fragment
                or not re.fullmatch(r"[A-Za-z0-9._+!-]+", filename)
                or not re.fullmatch(r"[a-f0-9]{64}", digest)
            ):
                raise SystemExit("pip artifact provenance did not pass validation")
            seen.add(identity)
            records.append({"name": name, "version": version, "filename": filename, "sha256": digest})

        target = dict(
            line.split("=", 1)
            for line in Path("container-scan-target.txt").read_text(encoding="utf-8").splitlines()
        )
        result = {
            "commit": target["commit"],
            "image_digest": target["build_manifest_digest"],
            "pip_install_artifacts": sorted(records, key=lambda row: row["name"].lower()),
        }
        Path("trading-pip-install-artifacts.json").write_text(
            json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8",
        )
        PYTHON

    - name: Retain raw container scan evidence
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.scan-target.outcome == 'success' }}
      with:
        name: container-scan-${{ matrix.dockerfile }}
        path: |
          container-scan-target.txt
          trading-pip-install-artifacts.json
          trivy-results-${{ matrix.dockerfile }}.sarif
          ${{ steps.grype-scan.outputs.sarif }}

  python-package-scan:
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
    name: Python Package Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keep PyPI traffic from the three manifests from overlapping.
      max-parallel: 1
      matrix:
        requirements: [requirements.txt, requirements-billing.txt, requirements-member-broker.txt]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      id: production-deps
      run: |
        set -euo pipefail
        # Exercise the application manifest without putting scanners into the same environment.
        python -m venv "$RUNNER_TEMP/nija-production-deps"
        "$RUNNER_TEMP/nija-production-deps/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/nija-production-deps/bin/python" -m pip install -r "${{ matrix.requirements }}"

    - name: Run pip-audit for vulnerability scanning
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/nija-pip-audit"
        "$RUNNER_TEMP/nija-pip-audit/bin/python" -m pip install pip-audit==2.10.1
        # Audit the exact production manifest, not the mutable runner environment.
        # The latter includes scanner tooling and may miss declared pins.
        "$RUNNER_TEMP/nija-pip-audit/bin/pip-audit" -r "${{ matrix.requirements }}" --desc --output pip-audit-report.json --format json

    - name: Upload pip-audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pip-audit-report-${{ matrix.requirements }}
        path: pip-audit-report.json

    - name: Scan for malicious packages with PyPI Guardian
      if: ${{ !cancelled() && steps.production-deps.outcome == 'success' }}
      env:
        GUARDDOG_PARALLELISM: '1'
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/nija-guarddog"
        "$RUNNER_TEMP/nija-guarddog/bin/python" -m pip install 'guarddog==3.2.0'
        if "$RUNNER_TEMP/nija-guarddog/bin/guarddog" pypi verify "${{ matrix.requirements }}" --output-format json --exit-non-zero-on-finding > guarddog-report.json; then
          guarddog_status=0
        else
          guarddog_status=$?
        fi
        python -S scripts/check_guarddog_report.py guarddog-report.json "$guarddog_status" "${{ matrix.requirements }}"

    - name: Upload GuardDog report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: guarddog-report-${{ matrix.requirements }}
        path: guarddog-report.json

  build-artifact-scan:
    name: Build Artifact Integrity Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build Python package
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        # Create a minimal setup.py if it doesn't exist
        if [ ! -f setup.py ]; then
          cat > setup.py << 'SETUPEOF'
        from setuptools import setup, find_packages
        setup(
            name="nija",
            version="1.0.0",
            packages=find_packages(),
            install_requires=[line.strip() for line in open('requirements.txt')],
        )
        SETUPEOF
        fi
        python -m build --wheel --sdist

    - name: Generate SBOM (Software Bill of Materials)
      run: |
        pip install cyclonedx-bom
        cyclonedx-py requirements requirements.txt -o sbom.json --of json

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: software-bill-of-materials
        path: sbom.json

    - name: Verify wheel integrity
      run: |
        pip install check-wheel-contents
        find dist -name "*.whl" -exec check-wheel-contents {} \; || echo "::warning::Wheel integrity issues detected"
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-build-artifacts
        path: dist/

  dependency-license-scan:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check licenses with pip-licenses
      run: |
        pip install pip-licenses
        pip-licenses --format=json --output-file=licenses-report.json
        pip-licenses --format=markdown --output-file=licenses-report.md
        echo "::group::License Summary"
        pip-licenses
        echo "::endgroup::"

    - name: Upload license reports
      uses: actions/upload-artifact@v4
      with:
        name: license-reports
        path: |
          licenses-report.json
          licenses-report.md

    - name: Check for GPL/AGPL licenses (strict copyleft)
      run: |
        pip install pip-licenses
        COPYLEFT=$(pip-licenses --format=csv | grep -iE "GPL|AGPL" || echo "")
        if [ ! -z "$COPYLEFT" ]; then
          echo "::warning::Strict copyleft licenses detected:"
          echo "$COPYLEFT"
        else
          echo "No strict copyleft licenses detected."
        fi
