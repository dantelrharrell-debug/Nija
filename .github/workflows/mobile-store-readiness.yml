name: Mobile Store Readiness

on:
  pull_request:
    paths:
      - 'android/**'
      - 'mobile/android/**'
      - 'scripts/validate_mobile_store_readiness.py'
      - 'mobile_api.py'
      - 'tests/test_mobile_data_unavailable.py'
      - 'tests/test_mobile_toggle_fail_closed.py'
      - '.github/workflows/mobile-store-readiness.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/android/**'
      - 'scripts/validate_mobile_store_readiness.py'
      - 'mobile_api.py'
      - 'tests/test_mobile_data_unavailable.py'
      - 'tests/test_mobile_toggle_fail_closed.py'

jobs:
  android-api-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test mobile trading toggle fail-closed semantics
        run: python tests/test_mobile_toggle_fail_closed.py
      - name: Test unavailable mobile account data semantics
        run: python tests/test_mobile_data_unavailable.py
      - name: Validate available Android SDK configuration (pre-generation audit)
        run: python scripts/validate_mobile_store_readiness.py
