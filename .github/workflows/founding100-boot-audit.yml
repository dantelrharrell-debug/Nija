name: Founding 100 read-only membership audit safety

on:
  pull_request:
    paths:
      - 'billing_service.py'
      - 'founding100_boot_audit.py'
      - 'scripts/founding100_readonly_certification.py'
      - 'tests/test_founding100_boot_audit.py'
      - '.github/workflows/founding100-boot-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NIJA_FOUNDING100_AUDIT_ON_STARTUP: 'false'
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python import and no-secret synthetic checks
        run: |
          python -m py_compile founding100_boot_audit.py billing_service.py
          python -m unittest discover -s tests -p 'test_founding100_boot_audit.py' -v
