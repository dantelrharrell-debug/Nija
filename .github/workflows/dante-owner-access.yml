name: Dante owner and account separation

on:
  pull_request:
    paths:
      - 'admin_access*.py'
      - 'bot/account_ownership.py'
      - 'bot/platform_account_layer.py'
      - 'bot/user_dashboard_api.py'
      - 'owner_dashboard*'
      - 'api_server.py'
      - 'gateway.py'
      - 'api_gateway.py'
      - 'fastapi_backend.py'
      - 'auth/user_database.py'
      - 'tests/test_admin_access.py'
      - 'tests/test_account_ownership.py'
      - 'tests/owner_dashboard_auth.test.cjs'
      - '.github/workflows/dante-owner-access.yml'

permissions:
  contents: read

jobs:
  owner-access-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependency versions needed for focused tests
        run: >-
          python -m pip install Flask==3.1.3 PyJWT==2.10.1 fastapi==0.110.0
          pydantic==2.7.0 httpx==0.28.1 cryptography==46.0.3 argon2-cffi==25.1.0
      - name: Verify ownership, role boundaries, revocation and dashboard sessions
        run: |
          python -m unittest discover -s tests -p test_admin_access.py -v
          python -m unittest discover -s tests -p test_account_ownership.py -v
          node --test tests/owner_dashboard_auth.test.cjs
