name: Render recovery verification regressions (offline)
on:
  pull_request:
    branches: [main, release/justcall-handoff-only-20261017]
    paths:
      - 'bot.py'
      - 'bot/redis_env.py'
      - 'start.sh'
      - 'tests/test_redis_configuration_error_privacy.py'
      - 'bot/bot_main.py'
      - 'bot/kraken_protected_startup_root.py'
      - 'bot/kraken_startup_receipts.py'
      - 'bot/kraken_startup_evidence_binding.py'
      - 'bot/kraken_canonical_startup_factory.py'
      - 'bot/kraken_native_four_source_binding.py'
      - 'tests/test_kraken_native_four_source_binding.py'
      - 'bot/kraken_collector_composition_v487.py'
      - 'tests/test_kraken_canonical_native_source_bindings.py'
      - 'tests/test_kraken_protected_startup_root.py'
      - 'scripts/nija_kraken_instance_diagnostic.py'
      - 'scripts/nija_render_recovery_verification.py'
      - 'scripts/render_runtime_build_sources.py'
      - 'scripts/apply*'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'bot/failure_cluster_engine.py'
      - 'bot/runtime_kraken_native_margin_backup_v380_patch.py'
      - 'tests/test_v392_hardened_client_id_patch.py'
      - 'ops/recovery/render_readonly_baseline.json'
      - 'tests/test_kraken_instance_diagnostic.py'
      - 'tests/test_render_recovery_verification.py'
      - 'tests/test_render_runtime_build_sources.py'
      - '.github/workflows/render*'
      - '.github/workflows/kraken-recovery-gate-diagnostics.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise offline fail-closed deployment, checkout, digest and authority boundaries
        run: |
          python -B -S -m unittest discover -s tests -p test_redis_configuration_error_privacy.py -v
          python -B -S -m unittest discover -s tests -p test_kraken_instance_diagnostic.py -v
          python -B -S -m unittest discover -s tests -p test_render_recovery_verification.py -v
          python -B -S -m unittest discover -s tests -p test_render_runtime_build_sources.py -v
          python -B -S -m unittest discover -s tests -p test_kraken_collector_composition_v487.py -v
          python -B -S -m unittest discover -s tests -p test_kraken_sqlite_readonly_preflight_v488.py -v
      - name: Install existing offline regression dependencies
        run: |
          python -m pip install pytest==8.2.2 redis==5.0.1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends redis-server
      - name: Exercise isolated ledger, protective exits, writer, nonce and all 13 evidence checks
        run: |
          python -m pytest -q \
            tests/test_v392_hardened_client_id_patch.py \
            bot/tests/test_failure_cluster_engine.py \
            bot/tests/test_runtime_kraken_native_margin_backup_v380.py \
            tests/test_kraken_instance_diagnostic.py \
            tests/test_render_recovery_verification.py \
            tests/test_kraken_collector_composition_v487.py \
            tests/test_kraken_sqlite_readonly_preflight_v488.py \
            tests/test_kraken_authenticated_ledger_gap_audit_v489.py \
            tests/test_kraken_exact_pending_order_recovery_v466.py \
            tests/test_kraken_protective_exit_readback_v485.py \
            tests/test_kraken_writer_nonce_evidence_v488.py \
            tests/test_kraken_nonce_redis_concurrency.py \
            bot/tests/test_distributed_nonce_manager_authority.py \
            bot/tests/test_kraken_writer_authority_gate_v91.py \
            tests/test_pretrade_multi_account_registration_v474.py \
            tests/test_pretrade_composition_bridge_v465.py \
            bot/tests/test_pretrade_attestation_validation_v452.py \
            tests/test_kraken_six_source_binding_contract_v490.py \
            tests/test_kraken_thirteen_source_reviewed_bridge_v491.py
