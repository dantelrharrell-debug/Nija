name: V426 targeted proof

on:
  push:
    branches:
      - fix/v426-v98-proxy-proof-handoff-20260921

jobs:
  targeted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run v97-v98 handoff and fail-closed regressions
        run: |
          python -m pytest -q bot/tests/test_runtime_truth_convergence_v97.py \
            -k "position_refresh or startup_refresh or nested_position_wrapper or startup_sync_guard"
          python -m pytest -q \
            bot/tests/test_position_sync_failure_truth_v98.py \
            tests/test_runtime_position_activation_liveness_v314_v315.py \
            bot/tests/test_live_authority_fail_closed_v94.py \
            bot/tests/test_runtime_universal_four_way_policy_v375.py
