name: NIJA course production readiness (read only)

on:
  pull_request:
    paths:
      - '.github/workflows/nija-course-production-readiness.yml'
  push:
    branches: [audit/nija-course-readiness-20261010]
    paths:
      - '.github/workflows/nija-course-production-readiness.yml'

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe public endpoints only, never mutate customer state
        env:
          NIJA_BILLING_URL: https://nija-billing-api.onrender.com
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["NIJA_BILLING_URL"].rstrip("/")

          def request(path, method="GET", body=None):
              req = Request(
                  base + path,
                  data=body,
                  method=method,
                  headers={"User-Agent": "NIJA-GitHub-Readiness/1.0"},
              )
              try:
                  with urlopen(req, timeout=18) as resp:
                      return resp.status, resp.read(8192)
              except HTTPError as exc:
                  return exc.code, exc.read(8192)

          def parsed(path):
              code, payload = request(path)
              try:
                  body = json.loads(payload)
              except (ValueError, UnicodeDecodeError):
                  raise AssertionError(path + ": expected JSON")
              return code, body

          problems = []
          checks = {}
          try:
              code, health = parsed("/healthz")
              checks["billing_health"] = code == 200 and health.get("status") == "ok"
              code, billing = parsed("/readyz")
              checks["billing_ready"] = code == 200 and billing.get("status") == "ready"
              code, course = parsed("/course-portal/readyz")
              flags = ("ready", "access_ready", "assets_present",
                       "email_configured", "access_key_configured")
              for flag in flags:
                  checks["course_" + flag] = code == 200 and course.get(flag) is True
              checks["course_checkout_access_enabled_reported"] = course.get("checkout_access_enabled")
              anonymous_status, _ = request("/course-portal/file/NIJA_Trading_Foundations_eBook.pdf")
              checks["anonymous_asset_denied"] = anonymous_status == 403
              fake_claim_status, _ = request("/course-portal/claim?token=invalid")
              checks["invalid_claim_denied"] = fake_claim_status == 403
              unsigned_status, _ = request("/api/billing/webhook", method="POST", body=b"{}")
              checks["unsigned_webhook_denied"] = unsigned_status == 400
          except Exception as exc:
              problems.append(type(exc).__name__)

          required = [v for k, v in checks.items()
                      if k != "course_checkout_access_enabled_reported"]
          passed = len(required) == 10 and all(value is True for value in required) and not problems
          report = {
              "safe_read_only_production_checks_passed": passed,
              "checks": checks,
              "errors": problems,
              "purchase_email_and_entitlement_flow_tested": False,
              "zapier_editor_mapping_tested": False,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## NIJA course readiness (production, no real purchase)\n\n")
              stream.write(json.dumps(report, indent=2, sort_keys=True) + "\n")
              stream.write("\nNo customer, email, Apollo, billing, or trading writes were made.\n")
          if not passed:
              sys.exit(1)
          PY
