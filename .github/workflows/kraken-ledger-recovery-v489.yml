name: Kraken v488-v489 read-only recovery regression
on:
  pull_request:
    branches:
      - release/justcall-handoff-only-20261017
    paths:
      - 'bot/kraken_sqlite_readonly_preflight_v488.py'
      - 'bot/kraken_authenticated_ledger_gap_audit_v489.py'
      - 'tests/test_kraken_sqlite_readonly_preflight_v488.py'
      - 'tests/test_kraken_authenticated_ledger_gap_audit_v489.py'
      - '.github/workflows/kraken-ledger-recovery-v489.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ledger-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit sources and offline tests
        run: |
          NIJA_DEFER_RUNTIME_SITE_HOOKS=1 python -S -m py_compile bot/kraken_sqlite_readonly_preflight_v488.py bot/kraken_authenticated_ledger_gap_audit_v489.py tests/test_kraken_sqlite_readonly_preflight_v488.py tests/test_kraken_authenticated_ledger_gap_audit_v489.py
      - name: Run real-ledger negative-path regression without production broker access
        run: |
          NIJA_DEFER_RUNTIME_SITE_HOOKS=1 python -S -B -m unittest discover -s tests -p test_kraken_sqlite_readonly_preflight_v488.py -v
          NIJA_DEFER_RUNTIME_SITE_HOOKS=1 python -S -B -m unittest discover -s tests -p test_kraken_authenticated_ledger_gap_audit_v489.py -v
