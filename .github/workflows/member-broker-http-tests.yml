name: Secure Member Broker HTTP Isolation Tests
on:
  pull_request:
    paths:
      - 'member_broker_http_api.py'
      - 'member_broker_entitlement.py'
      - 'member_broker_vault.py'
      - 'member_broker_onboarding.py'
      - 'member_broker_kraken_readonly.py'
      - 'tests/test_member_broker_*.py'
      - 'tests/member_broker_dashboard.test.cjs'
      - 'web/member/**'
      - 'scripts/member_broker_readiness_preflight.py'
      - 'requirements-member-broker.txt'
      - '.github/workflows/member-broker-http-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
      NIJA_VAULT_INTAKE_ENABLED: 'false'
      NIJA_VAULT_VERIFICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated requirements
        run: |
          python -m pip install -r requirements-member-broker.txt
          python -m pip install pytest==8.2.2
      - name: No-secret safety regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_member_broker_http_api.py' -v
          python -B -m unittest discover -s tests -p 'test_member_broker_onboarding.py' -v
          python -B -m unittest discover -s tests -p 'test_member_broker_vault.py' -v
          python -B -m unittest discover -s tests -p 'test_member_broker_verification.py' -v
          python -B -m unittest discover -s tests -p 'test_member_broker_render_readiness.py' -v
          python -B -m pytest -q tests/test_member_broker_kraken_readonly.py tests/test_member_broker_setup_guidance.py
          node --check web/member/memberBrokerApi.mjs
          node --test tests/member_broker_dashboard.test.cjs
