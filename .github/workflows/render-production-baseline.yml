name: Reviewed Render production baseline (read-only)
on:
  workflow_call:
    secrets:
      RENDER_API_KEY:
        required: false
      NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY:
        required: false
    outputs:
      approved_commit:
        value: ${{ jobs.verify.outputs.approved_commit }}
      approved_deployment_id:
        value: ${{ jobs.verify.outputs.approved_deployment_id }}
      verification_source_commit:
        value: ${{ jobs.verify.outputs.verification_source_commit }}
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/release/justcall-handoff-only-20261017'
    # Limit this environment to the production release and keep its
    # approval JSON secret separate from versioned source. For sole-owner
    # repos, documented owner authorization of READ-ONLY diagnostics can be
    # used without inventing a second human reviewer. This cannot authorize
    # trading, and missing approval denies before Render access.
    environment: nija-render-recovery-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      approved_commit: ${{ steps.baseline.outputs.approved_commit }}
      approved_deployment_id: ${{ steps.baseline.outputs.approved_deployment_id }}
      verification_source_commit: ${{ steps.baseline.outputs.verification_source_commit }}
    steps:
      - name: Checkout verification control code from the production release only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed approval, independent Render metadata, source and runtime
        id: baseline
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
          NIJA_RENDER_READONLY_APPROVAL_JSON: ${{ secrets.NIJA_RENDER_READONLY_APPROVAL_JSON }}
        run: python -B -S -m scripts.nija_render_recovery_verification
      - name: Retain sanitized machine-readable verification outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-recovery-verification
          path: render-recovery-verification.json
          if-no-files-found: error
          retention-days: 14
