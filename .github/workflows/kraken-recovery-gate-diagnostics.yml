name: Kraken recovery gate diagnostics (read-only)
on:
  workflow_dispatch:
    inputs:
      current_instance:
        description: Inspect current baseline process and sanitized runtime log signals only
        type: boolean
        default: false
      identity_compare:
        description: Read the existing one-shot identity receipt only; never publish or replay requests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kraken-recovery-gate-diagnostics
  cancel-in-progress: false
jobs:
  baseline:
    uses: ./.github/workflows/render-production-baseline.yml
    secrets: inherit
  inspect:
    needs: baseline
    if: inputs.current_instance != true && inputs.identity_compare != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check fixed production recovery prerequisites without writing state
        shell: bash
        env:
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
          APPROVED_COMMIT: ${{ needs.baseline.outputs.approved_commit }}
        run: |
          set -eu
          if [ -z "$RENDER_RECOVERY_SSH_KEY" ]; then
            echo 'BLOCKED: dedicated recovery SSH secret missing'
            exit 2
          fi
          umask 077
          recovery_dir=$(mktemp -d)
          trap 'rm -rf "$recovery_dir"' EXIT
          printf '%s\n' "$RENDER_RECOVERY_SSH_KEY" > "$recovery_dir/key"
          unset RENDER_RECOVERY_SSH_KEY
          ssh-keygen -y -P '' -f "$recovery_dir/key" >/dev/null 2>&1 || {
            echo 'BLOCKED: recovery SSH key invalid'
            exit 2
          }
          ssh-keyscan -t ed25519 -T 15 ssh.oregon.render.com > "$recovery_dir/known_hosts" 2>/dev/null
          observed=$(ssh-keygen -lf "$recovery_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [ "$observed" != 'SHA256:KkZPgnApmttFYSkdJsCi7B01sgZPMI6kY53MDbbanGM' ]; then
            echo 'BLOCKED: Render host fingerprint mismatch'
            exit 2
          fi
          ssh -T -i "$recovery_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$recovery_dir/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
            srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com \
            "env NIJA_APPROVED_RENDER_COMMIT=$APPROVED_COMMIT python -B -S -" <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          if (os.environ.get('RENDER_SERVICE_ID') != 'srv-d98dsr5aeets73fpbaqg'
                  or os.environ.get('RENDER_GIT_COMMIT') != os.environ.get('NIJA_APPROVED_RENDER_COMMIT')):
              raise SystemExit('BLOCKED: independently approved deployment changed')

          def checked_file(label, path, expected):
              p = Path(path)
              safe = False
              try:
                  info = p.lstat()
                  safe = stat.S_ISREG(info.st_mode) and not p.is_symlink()
                  matched = safe and hashlib.sha256(p.read_bytes()).hexdigest() == expected
              except (OSError, ValueError):
                  matched = False
              print(label + ('_MATCH' if matched else '_MISSING_OR_CHANGED'))
              if label == 'HISTORY_SOURCE':
                  # Source code digests are non-secret. Do not emit source bytes,
                  # environment variables, credentials, or financial records.
                  if safe:
                      print('HISTORY_SOURCE_OBSERVED_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())
                      print('HISTORY_SOURCE_OBSERVED_BYTES=' + str(info.st_size))
                  else:
                      print('HISTORY_SOURCE_NOT_A_REGULAR_FILE')
              return matched

          all_sources_ok = all((
              checked_file('PREFLIGHT_SOURCE', '/app/bot/kraken_sqlite_readonly_preflight_v488.py',
                           '480e01a7ee4326ee9fc85b202f0fafb413f733cd035d9d957142488d69a05452'),
              checked_file('HISTORY_SOURCE', '/app/bot/kraken_live_history_recovery.py',
                           '02d382407fe6f71fd8cb36190c5c87fcdb0f79e6ef4f62d597e633343e99e4df'),
              checked_file('EXIT_OBSERVER_SOURCE', '/app/bot/universal_broker_exit_supervisor_patch.py',
                           '7970751561b5dfa6dde1542903289c4351ba15c47b84a7ab315abe39c3aa1758'),
          ))
          root = Path('/data/kraken-history-recovery')
          try:
              info = root.lstat()
              private_root = (stat.S_ISDIR(info.st_mode) and not root.is_symlink()
                              and root.resolve() == root and info.st_uid == os.geteuid()
                              and not (stat.S_IMODE(info.st_mode) & 0o077))
          except OSError:
              private_root = False
          print('RECOVERY_DIRECTORY_' + ('PRIVATE' if private_root else 'MISSING_OR_UNSAFE'))
          if private_root:
              for label, name in (
                  ('PRIOR_HISTORY_CLAIM', '997eae3f9df551e06ffab7a9cf0dc60d.claimed.json'),
                  ('CURSOR_FAILURE_RECEIPT', 'd7baa71731e633d1c6f4c9848505ab98.evidence.json'),
                  ('BOUNDED_OFFSET_RECEIPT', '97dbb6dc01e97936829e0e3656fdbcf1.evidence.json'),
                  ('FULL_HISTORY_RECEIPT', 'aec7c56e2aa9cff292f1f6ffe94829d4.evidence.json'),
              ):
                  p = root / name
                  try:
                      i = p.lstat()
                      valid = (stat.S_ISREG(i.st_mode) and not p.is_symlink()
                               and i.st_uid == os.geteuid()
                               and not (stat.S_IMODE(i.st_mode) & 0o077))
                  except OSError:
                      valid = False
                  print(label + ('_PRIVATE_PRESENT' if valid else '_ABSENT_OR_UNSAFE'))
          print('DIAGNOSTIC_ONLY_NO_BROKER_CALLS_NO_LEDGER_WRITES')
          if not all_sources_ok or not private_root:
              raise SystemExit('BLOCKED: reviewed production prerequisites not verified')
          PY
  current-instance:
    needs: baseline
    if: inputs.current_instance == true || inputs.identity_compare == true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/justcall-handoff-only-20261017
          persist-credentials: false
      - name: Inspect baseline and optionally read the existing identity receipt
        id: instance
        shell: bash
        env:
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
          IDENTITY_COMPARE: ${{ inputs.identity_compare }}
          APPROVED_COMMIT: ${{ needs.baseline.outputs.approved_commit }}
        run: |
          set -eu
          if [ -z "$RENDER_RECOVERY_SSH_KEY" ]; then
            echo 'BLOCKED: dedicated recovery SSH secret missing'
            exit 2
          fi
          umask 077
          recovery_dir=$(mktemp -d)
          trap 'rm -f "$recovery_dir/key" "$recovery_dir/known_hosts"; rmdir "$recovery_dir"' EXIT
          printf '%s\n' "$RENDER_RECOVERY_SSH_KEY" > "$recovery_dir/key"
          unset RENDER_RECOVERY_SSH_KEY
          ssh-keygen -y -P '' -f "$recovery_dir/key" >/dev/null 2>&1 || {
            echo 'BLOCKED: recovery SSH key invalid'
            exit 2
          }
          ssh-keyscan -t ed25519 -T 15 ssh.oregon.render.com > "$recovery_dir/known_hosts" 2>/dev/null
          observed=$(ssh-keygen -lf "$recovery_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [ "$observed" != 'SHA256:KkZPgnApmttFYSkdJsCi7B01sgZPMI6kY53MDbbanGM' ]; then
            echo 'BLOCKED: Render host fingerprint mismatch'
            exit 2
          fi
          report=$(ssh -T -i "$recovery_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$recovery_dir/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
            srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com \
            "env NIJA_APPROVED_RENDER_COMMIT=$APPROVED_COMMIT python -B -S -" < scripts/nija_kraken_instance_diagnostic.py) || {
              printf '%s\n' "$report"
              exit 2
          }
          printf '%s\n' "$report"
          instance=$(printf '%s\n' "$report" | jq -r '.instance_id // ""')
          if [[ "$instance" =~ ^[a-zA-Z0-9-]{1,100}$ ]]; then
            printf 'instance=%s\n' "$instance" >> "$GITHUB_OUTPUT"
          fi
          if [ "$IDENTITY_COMPARE" = 'true' ]; then
            remote="env NIJA_APPROVED_RENDER_COMMIT=$APPROVED_COMMIT python -B -S - --identity-result"
            identity=$(ssh -T -i "$recovery_dir/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$recovery_dir/known_hosts" \
              -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
              -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
              srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com \
              "$remote" < scripts/nija_kraken_instance_diagnostic.py) || {
              printf '%s\n' "$identity"
              exit 2
            }
            printf '%s\n' "$identity"
          fi
      - name: Read current-instance Render logs and deployment metadata
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          EXPECTED_RENDER_INSTANCE: ${{ steps.instance.outputs.instance }}
          NIJA_APPROVED_RENDER_COMMIT: ${{ needs.baseline.outputs.approved_commit }}
          NIJA_APPROVED_RENDER_DEPLOYMENT_ID: ${{ needs.baseline.outputs.approved_deployment_id }}
        run: python -B -S scripts/nija_kraken_instance_diagnostic.py --render-api
  outcomes:
    if: always()
    needs: [baseline, inspect, current-instance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish diagnostic outcomes separately from certification
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          INSPECT_RESULT: ${{ needs.inspect.result }}
          INSTANCE_RESULT: ${{ needs.current-instance.result }}
        run: |
          python -I - <<'PY'
          import json, os
          from pathlib import Path
          baseline = os.environ["BASELINE_RESULT"] == "success"
          jobs = [os.environ["INSPECT_RESULT"], os.environ["INSTANCE_RESULT"]]
          success = baseline and sorted(jobs) == ["skipped", "success"]
          report = {
              "WORKFLOW_EXECUTION_SUCCESS": success,
              "DEPLOYMENT_BASELINE_VERIFIED": baseline,
              "SOURCE_INTEGRITY_VERIFIED": baseline,
              "RUNTIME_ACCESS_VERIFIED": baseline,
              "BROKER_EVIDENCE_VERIFIED": False,
              "CERTIFICATION_COMPLETE": False,
              "mode": "READ_ONLY_RECOVERY", "allow_new_orders": False,
          }
          Path("recovery-outcomes.json").write_text(json.dumps(report, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          raise SystemExit(0 if success else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-recovery-outcomes
          path: recovery-outcomes.json
          if-no-files-found: error
