name: TIQ72 isolated migration safety (synthetic only)

on:
  pull_request:
    paths:
      - 'scripts/migrate_tiq72_upgrade6_isolated.py'
      - 'tests/test_migrate_tiq72_upgrade6_isolated.py'
      - 'tests/test_tiq72_real_postgres18_schema_ci.py'
      - 'web/trading-challenge/v515/server/sql/tiq72-v515-report-ledger.sql'
      - '.github/workflows/tiq72-isolated-migration-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Confirm no cross-workspace migration or unapproved DDL
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local test runner only
        run: python -m pip install pytest==8.2.2
      - name: Syntax check (no DB connection)
        run: python -m py_compile scripts/migrate_tiq72_upgrade6_isolated.py tests/test_migrate_tiq72_upgrade6_isolated.py
      - name: Mock database identity, backup, transaction and rollback
        run: python -m pytest -q tests/test_migrate_tiq72_upgrade6_isolated.py

  ephemeral-postgres18:
    name: Validate actual v515 DDL on disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned isolated PostgreSQL driver for disposable CI
        run: python -m pip install --only-binary=:all: -r web/trading-challenge/server/requirements-tiq72-preflight.txt
      - name: Generate throwaway local-only database credential
        run: |
          ci_credential="$(openssl rand -hex 24)"
          echo "::add-mask::$ci_credential"
          printf 'PGPASSWORD=%s\n' "$ci_credential" >> "$GITHUB_ENV"
      - name: Start PostgreSQL 18 bound only to runner loopback
        run: |
          docker run -d --rm --name nija-tiq72-ci-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=nija_tiq72_ci_scratch \
            --env POSTGRES_USER=nija_tiq72_ci \
            --env POSTGRES_PASSWORD="$PGPASSWORD" \
            postgres:18
          for attempt in $(seq 1 30); do
            if docker exec nija-tiq72-ci-postgres pg_isready -U nija_tiq72_ci -d nija_tiq72_ci_scratch; then
              exit 0
            fi
            sleep 2
          done
          echo 'Disposable PostgreSQL failed to become ready' >&2
          exit 1
      - name: Prove schema DDL, uniqueness, foreign keys, constraints, and rollback
        env:
          NIJA_TIQ72_CI_EPHEMERAL_POSTGRES: '1'
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGDATABASE: nija_tiq72_ci_scratch
          PGUSER: nija_tiq72_ci
        run: python -m unittest discover -s tests -p 'test_tiq72_real_postgres18_schema_ci.py' -v
      - name: Destroy disposable PostgreSQL instance and volumes
        if: always()
        run: docker rm -f nija-tiq72-ci-postgres >/dev/null 2>&1 || true
