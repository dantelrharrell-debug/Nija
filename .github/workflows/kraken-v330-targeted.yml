name: Kraken v330 targeted validation

on:
  pull_request:
    paths:
      - 'bot/runtime_kraken_authoritative_snapshot_liveness_v330_patch.py'
      - 'bot/runtime_kraken_recent_balance_prewait_v319_patch.py'
      - 'bot/runtime_kraken_position_refresh_liveness_v286_patch.py'
      - 'bot/trading_strategy.py'
      - 'bot/kraken_symbol_mapper.py'
      - 'bot/tests/test_kraken_symbol_mapper_aliases.py'
      - 'tests/test_runtime_kraken_authoritative_snapshot_liveness_v330.py'
      - 'tests/test_kraken_inflight_balance_handoff.py'
      - '.github/workflows/kraken-v330-targeted.yml'

jobs:
  v330-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
      DRY_RUN_MODE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CI sitecustomize defer guard
        run: python -S scripts/install_sitecustomize_defer_guard.py
      - name: Run Kraken v330 regression tests
        run: >-
          python -m unittest -v
          tests.test_runtime_kraken_authoritative_snapshot_liveness_v330
          tests.test_kraken_inflight_balance_handoff
          bot.tests.test_kraken_symbol_mapper_aliases
