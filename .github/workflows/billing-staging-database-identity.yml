name: NIJA Billing Staging Database Identity Safety

on:
  pull_request:
    paths:
      - 'billing_staging_database_binding.py'
      - 'billing_service.py'
      - 'tests/test_billing_staging_database_binding.py'
      - '.github/workflows/billing-staging-database-identity.yml'
  push:
    branches: [main]
    paths:
      - 'billing_staging_database_binding.py'
      - 'billing_service.py'
      - 'tests/test_billing_staging_database_binding.py'
      - '.github/workflows/billing-staging-database-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-staging-database-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned billing SQLAlchemy dependency
        run: python -m pip install 'SQLAlchemy==2.0.25'
      - name: Syntax-check fail-closed identity helper
        run: python -m py_compile billing_staging_database_binding.py tests/test_billing_staging_database_binding.py
      - name: Run isolated, credential-free database identity safety tests
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/tests"
          cp billing_staging_database_binding.py "$tmpdir/"
          cp tests/test_billing_staging_database_binding.py "$tmpdir/tests/"
          cd "$tmpdir"
          PYTHONNOUSERSITE=1 python -m unittest discover -s tests -p 'test_billing_staging_database_binding.py' -v
