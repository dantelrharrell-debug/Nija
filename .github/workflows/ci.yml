name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep ordinary CI Python processes from importing production startup
      # hooks that can start writer, broker, activation, or execution monitors.
      NIJA_DEFER_RUNTIME_SITE_HOOKS: "1"
      # Repository secrets used by tests when present.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
      COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
      COINBASE_PEM_CONTENT: ${{ secrets.COINBASE_PEM_CONTENT }}
      # Secrets cannot be referenced directly in a step-level `if:` expression.
      # Copy the optional SSH key into job env and gate on env instead.
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start SSH agent and add private key
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Ensure github.com known host
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install CI sitecustomize defer guard
        run: python -S scripts/install_sitecustomize_defer_guard.py

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python scripts/run_unittest_baseline.py \
            --baseline .github/ci_known_test_failures.txt
