name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep ordinary CI Python processes from importing production startup
      # hooks that can start writer, broker, activation, or execution monitors.
      NIJA_DEFER_RUNTIME_SITE_HOOKS: "1"
      # Secrets cannot be referenced directly in a step-level `if:` expression.
      # Copy the optional SSH key into job env and gate on env instead.
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start SSH agent and add private key
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Ensure github.com known host
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install CI sitecustomize defer guard
        run: python -S scripts/install_sitecustomize_defer_guard.py

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remove SSH agent identities before tests
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        run: |
          ssh-add -D
          if ssh-add -l >/dev/null 2>&1; then
            echo "::error::SSH identities remain loaded after dependency installation"
            exit 1
          fi
          echo "SSH_AUTH_SOCK=" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          GH_TOKEN: ""
          SSH_PRIVATE_KEY: ""
          COINBASE_API_KEY: ""
          COINBASE_API_SECRET: ""
          COINBASE_PEM_CONTENT: ""
        run: |
          set +e
          python scripts/run_unittest_baseline.py \
            --baseline .github/ci_known_test_failures.txt \
            > /tmp/nija-unittest-baseline.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::CI baseline failure tail"
            tail -n 800 /tmp/nija-unittest-baseline.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 80 /tmp/nija-unittest-baseline.log

      - name: Run private international trade reporting regressions
        env:
          NIJA_DEFER_RUNTIME_SITE_HOOKS: "1"
        run: |
          python -m unittest discover -s tests -p test_international_user_trade_reporting.py -v
          node --check frontend/static/js/app.js
          node --test tests/international_trade_display.test.cjs

      - name: Run mandatory fail-closed safety regressions
        env:
          GH_TOKEN: ""
          SSH_PRIVATE_KEY: ""
          COINBASE_API_KEY: ""
          COINBASE_API_SECRET: ""
          COINBASE_PEM_CONTENT: ""
        run: |
          python -m pytest -q \
            bot/tests/test_canonical_kraken_recovery_deferral.py \
            bot/tests/test_production_runtime_convergence_v88.py \
            bot/tests/test_v420_monitor_start_order_v421.py \
            tests/test_authority_marker_atomic_publication.py \
            bot/tests/test_runtime_execution_capital_integrity_v169.py \
            bot/tests/test_runtime_execution_activation_protection_v347.py \
            bot/tests/test_runtime_position_protection_liveness_v348.py \
            bot/tests/test_live_authority_fail_closed_v94.py \
            bot/tests/test_v2_pipeline_import_recovery.py \
            bot/tests/test_canonical_fast_entrypoint_v28.py \
            bot/tests/test_operator_emergency_stop_clear_patch.py \
            bot/tests/test_canonical_operator_emergency_stop_clear_v416.py \
            bot/tests/test_runtime_execution_breaker_recovery_v405.py \
            bot/tests/test_runtime_terminal_exit_heartbeat_truth_v349.py \
            bot/tests/test_runtime_universal_four_way_policy_v375.py \
            bot/tests/test_runtime_kraken_delayed_fill_reconciliation_v357.py \
            bot/tests/test_runtime_kraken_deferred_fill_proof_recovery_v363.py \
            bot/tests/test_kraken_recovery_marker_admission.py \
            bot/tests/test_execution_proof_startup_isolation_v339.py \
            bot/tests/test_runtime_execution_position_readiness_v346.py \
            bot/tests/test_heartbeat_min_notional_local_defer_v431.py \
            bot/tests/test_post_core_pending_same_process_v427.py \
            bot/tests/test_trading_state_persistence_concurrency.py \
            bot/tests/test_runtime_kraken_margin_canonical_coverage_v366.py \
            bot/tests/test_kraken_all_account_exit_runtime.py \
            bot/tests/test_runtime_pnl_ledger_repair_v414.py \
            bot/tests/test_pending_kraken_close_audit_v434.py \
            bot/tests/test_confirmed_strategy_order_provenance_v433.py \
            bot/tests/test_runtime_heartbeat_no_rearm_v433.py \
            bot/tests/test_research_edge_ranking_v432.py
