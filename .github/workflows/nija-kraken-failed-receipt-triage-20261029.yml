name: NIJA Kraken failed-receipt triage (no broker requests)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [release/justcall-handoff-only-20261017]
    paths: ['.github/workflows/nija-kraken-failed-receipt-triage-20261029.yml']
permissions:
  contents: read
jobs:
  receipt-triage:
    if: >-
      github.event.pull_request.number == 3499 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/nija-independent-recovery-20261029' &&
      github.event.pull_request.base.ref == 'release/justcall-handoff-only-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect four existing redacted Kraken receipts without any API calls
        shell: bash
        env:
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [ -z "${RENDER_RECOVERY_SSH_KEY:-}" ]; then
            echo 'BLOCKED: dedicated recovery SSH credential missing'
            exit 2
          fi
          secure="$(mktemp -d)"
          trap 'rm -rf "$secure"' EXIT
          printf '%s\n' "$RENDER_RECOVERY_SSH_KEY" > "$secure/key"
          unset RENDER_RECOVERY_SSH_KEY
          chmod 600 "$secure/key"
          ssh-keygen -y -P '' -f "$secure/key" > /dev/null 2>&1 || exit 2
          ssh-keyscan -t ed25519 -T 15 ssh.oregon.render.com > "$secure/known_hosts" 2>/dev/null
          observed="$(ssh-keygen -lf "$secure/known_hosts" -E sha256 | awk '{print $2}' | sort -u)"
          test "$observed" = 'SHA256:KkZPgnApmttFYSkdJsCi7B01sgZPMI6kY53MDbbanGM' || {
            echo 'BLOCKED: SSH host identity mismatch'
            exit 2
          }
          ssh_opts=(
            -T -i "$secure/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o IdentityAgent=none -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$secure/known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15
            -o ServerAliveInterval=10 -o ServerAliveCountMax=1
          )
          remote=srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com
          remote_guard='test "${RENDER_SERVICE_ID:-}" = "srv-d98dsr5aeets73fpbaqg" && test "${RENDER_GIT_COMMIT:-}" = "37cf08a504a0ea31401aefbdd3aa71d13e943b5d" && test -n "${NIJA_KRAKEN_HISTORY_RECOVERY_DIR:-}"'
          ssh "${ssh_opts[@]}" "$remote" "$remote_guard" >/dev/null || {
            echo 'BLOCKED: no verified recovery receipt directory on pinned production'
            exit 2
          }
          echo 'KRAKEN_RECOVERY_RECEIPT_STORE=VERIFIED_CONFIGURED'
          good=0
          cases=(
            initial_history:91cefe76c2c7d7164608bb4ffb195532
            cursor_history:d7baa71731e633d1c6f4c9848505ab98
            offset_page_budget:97dbb6dc01e97936829e0e3656fdbcf1
            open_orders:aec7c56e2aa9cff292f1f6ffe94829d4
          )
          for item in "${cases[@]}"; do
            label="${item%%:*}"
            id="${item##*:}"
            request="cd /app && python -B -S scripts/nija_kraken_failure_receipt_triage_v464.py --recovery-dir \"${NIJA_KRAKEN_HISTORY_RECOVERY_DIR}\" --request-id $id"
            if result="$(ssh "${ssh_opts[@]}" "$remote" "$request" 2>/dev/null)"; then
              printf '%s\n' "$result" | jq -ce --arg case "$label" \
                '{case:$case,status:.status,failure_code:.failure_code,failure_endpoint:.failure_endpoint,api_failure_reason:.api_failure_reason,complete_page_budget_known:.complete_page_budget_known,requested_pages:.requested_pages,required_pages:.required_pages,execution_authorized:.execution_authorized}'
              good=$((good + 1))
            else
              echo "RECEIPT_${label}=NOT_VERIFIED"
            fi
          done
          echo 'RECEIPT_TRIAGE_PERFORMED_BROKER_READS=false'
          echo 'TRADING_AUTHORIZED=false'
          test "$good" -gt 0 || {
            echo 'BLOCKED: no historical Kraken failure receipt could be validated'
            exit 2
          }
