name: NIJA Kraken failed-receipt triage (no broker requests)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [release/justcall-handoff-only-20261017]
    paths: ['.github/workflows/nija-kraken-failed-receipt-triage-20261029.yml']
permissions:
  contents: read
jobs:
  receipt-triage:
    if: >-
      github.event.pull_request.number == 3499 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/nija-independent-recovery-20261029' &&
      github.event.pull_request.base.ref == 'release/justcall-handoff-only-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect four existing redacted Kraken receipts without any API calls
        shell: bash
        env:
          RENDER_RECOVERY_SSH_KEY: ${{ secrets.NIJA_RENDER_RECOVERY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          if [ -z "${RENDER_RECOVERY_SSH_KEY:-}" ]; then
            echo 'BLOCKED: dedicated recovery SSH credential missing'
            exit 2
          fi
          secure="$(mktemp -d)"
          trap 'rm -rf "$secure"' EXIT
          printf '%s\n' "$RENDER_RECOVERY_SSH_KEY" > "$secure/key"
          unset RENDER_RECOVERY_SSH_KEY
          chmod 600 "$secure/key"
          ssh-keygen -y -P '' -f "$secure/key" > /dev/null 2>&1 || exit 2
          ssh-keyscan -t ed25519 -T 15 ssh.oregon.render.com > "$secure/known_hosts" 2>/dev/null
          observed="$(ssh-keygen -lf "$secure/known_hosts" -E sha256 | awk '{print $2}' | sort -u)"
          test "$observed" = 'SHA256:KkZPgnApmttFYSkdJsCi7B01sgZPMI6kY53MDbbanGM' || {
            echo 'BLOCKED: SSH host identity mismatch'
            exit 2
          }
          ssh -T -i "$secure/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o IdentityAgent=none -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$secure/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
            srv-d98dsr5aeets73fpbaqg@ssh.oregon.render.com \
            "python -B -S -" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          if (os.environ.get("RENDER_SERVICE_ID") != "srv-d98dsr5aeets73fpbaqg"
              or os.environ.get("RENDER_GIT_COMMIT") != "37cf08a504a0ea31401aefbdd3aa71d13e943b5d"):
              raise SystemExit("BLOCKED: production SHA mismatch")
          script = Path("/app/scripts/nija_kraken_failure_receipt_triage_v464.py")
          raw = script.read_bytes()
          pin = "28f5c2ce315866e96e00548fbceef3352684678c"
          if (script.is_symlink() or
              hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest() != pin):
              raise SystemExit("BLOCKED: triage code is not the reviewed production version")
          directory = os.environ.get("NIJA_KRAKEN_HISTORY_RECOVERY_DIR")
          if not directory:
              raise SystemExit("BLOCKED: historical receipt storage not configured")
          sys.path.insert(0, "/app")
          from scripts.nija_kraken_failure_receipt_triage_v464 import inspect_failure, TriageFailure
          cases = (
              ("initial_history", "91cefe76c2c7d7164608bb4ffb195532"),
              ("cursor_history", "d7baa71731e633d1c6f4c9848505ab98"),
              ("offset_page_budget", "97dbb6dc01e97936829e0e3656fdbcf1"),
              ("open_orders", "aec7c56e2aa9cff292f1f6ffe94829d4"),
          )
          fields = ("status", "failure_code", "failure_endpoint",
                    "api_failure_reason", "complete_page_budget_known",
                    "requested_pages", "required_pages", "execution_authorized")
          for label, request_id in cases:
              try:
                  result = inspect_failure(Path(directory), request_id)
                  sanitized = {field: result[field] for field in fields if field in result}
                  print(json.dumps({"case": label, **sanitized}, sort_keys=True))
              except (TriageFailure, ValueError, OSError):
                  print(json.dumps({"case": label, "status": "RECEIPT_NOT_VERIFIED"}, sort_keys=True))
          print("RECEIPT_TRIAGE_PERFORMED_BROKER_READS=false")
          print("TRADING_AUTHORIZED=false")
          PY
