name: NIJA public course commerce readiness

# No Stripe charges, lead submissions, customer emails, or brokerage calls.
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/website-commerce-readiness.yml'
      - 'FOUNDATIONS_DELIVERY_RUNBOOK.md'
      - 'scripts/course_profit_probe.py'
      - 'tests/test_course_profit_probe.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-commerce-readiness.yml'
      - 'FOUNDATIONS_DELIVERY_RUNBOOK.md'

permissions:
  contents: read

concurrency:
  group: nija-public-course-commerce-readiness
  cancel-in-progress: false

jobs:
  read-only-course-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verification source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify local probe import
        run: python -c "from scripts.course_profit_probe import classify_profit_probe"
      - name: Verify public storefront, payment backend and private asset protection
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from scripts.course_profit_probe import classify_profit_probe
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          billing = "https://nija-billing-api.onrender.com"
          website = "https://nijaaitrading.com"
          status = {}
          errors = []

          def fetch(host, path, attempts=3):
              last = None
              for n in range(attempts):
                  req = Request(host + path, headers={
                      "User-Agent": "NIJA-ReadOnly-Commerce-Health/1.0",
                      "Accept": "application/json,text/html",
                  }, method="GET")
                  try:
                      with urlopen(req, timeout=20) as response:
                          return response.status, response.read(8192)
                  except HTTPError as exc:
                      last = (exc.code, exc.read(8192))
                      if exc.code < 500 or n == attempts - 1:
                          return last
                  except (URLError, TimeoutError, OSError) as exc:
                      last = (0, b"")
                      errors.append(type(exc).__name__)
                  if n < attempts - 1:
                      time.sleep(2)
              return last or (0, b"")

          def json_path(host, path):
              code, raw = fetch(host, path)
              try:
                  obj = json.loads(raw)
              except (ValueError, UnicodeError):
                  obj = {}
              return code, obj

          # Render free-tier instances may need time to start after inactivity.
          # Gate functional and security checks on confirmed application liveness;
          # never treat a transient platform 503 as an authorization success.
          startup_deadline = time.monotonic() + 240
          startup_attempts = 0
          startup_http_statuses = []
          while True:
              startup_attempts += 1
              startup_code, startup_body = fetch(billing, "/healthz", attempts=1)
              startup_http_statuses.append(startup_code)
              try:
                  startup_payload = json.loads(startup_body)
              except (ValueError, UnicodeError):
                  startup_payload = {}
              if startup_code == 200 and startup_payload.get("status") == "ok":
                  break
              if time.monotonic() >= startup_deadline:
                  print(json.dumps({
                      "startup_gate": "failed",
                      "attempts": startup_attempts,
                      "http_statuses": startup_http_statuses,
                      "note": "No functional or authorization probes were run before liveness",
                  }))
                  sys.exit(1)
              time.sleep(8)

          # Expose HTTP codes only, not response bodies, credentials or customer data.
          http_statuses = {"/healthz": startup_code}
          print(json.dumps({
              "startup_gate": "passed",
              "attempts": startup_attempts,
              "http_statuses": startup_http_statuses,
          }))

          health_code, health = json_path(billing, "/healthz")
          http_statuses["/healthz"] = health_code
          status["billing_health"] = health_code == 200 and health.get("status") == "ok"

          billing_code, billing_ready = json_path(billing, "/readyz")
          http_statuses["/readyz"] = billing_code
          status["billing_provider_ready"] = billing_code == 200 and billing_ready.get("status") == "ready"

          course_code, course = json_path(billing, "/course-portal/readyz")
          http_statuses["/course-portal/readyz"] = course_code
          for flag in ["ready", "access_ready", "assets_present",
                       "email_configured", "access_key_configured"]:
              status["course_" + flag] = course_code == 200 and course.get(flag) is True

          # checkout_access_enabled concerns server-created Checkout, not the
          # existing active live Stripe Payment Link. Treat as informational.
          course_checkout_access = course.get("checkout_access_enabled")

          portal_code, portal_body = fetch(billing, "/course-portal/")
          http_statuses["/course-portal/"] = portal_code
          status["course_recovery_page_online"] = (
              portal_code == 200 and b"Course Access" in portal_body
          )
          page_code, _ = fetch(website, "/trading-foundations")
          http_statuses["/trading-foundations"] = page_code
          status["public_course_page_online"] = page_code == 200

          forbidden_file_code, _ = fetch(
              billing, "/course-portal/file/NIJA_Trading_Foundations_eBook.pdf"
          )
          http_statuses["/course-portal/file/<redacted>"] = forbidden_file_code
          status["anonymous_paid_file_denied"] = forbidden_file_code == 403

          invalid_claim_code, _ = fetch(
              billing, "/course-portal/claim?token=public-health-invalid"
          )
          http_statuses["/course-portal/claim?<redacted>"] = invalid_claim_code
          status["invalid_access_claim_denied"] = invalid_claim_code == 403

          profit_code, profit_payload = json_path(
              billing, "/api/admin/website-profit?period=2026-09"
          )
          http_statuses["/api/admin/website-profit"] = profit_code
          profit_classification = classify_profit_probe(profit_code, profit_payload)
          # Optional reporting can be disabled fail-closed. This does NOT
          # certify authentication or signed financial evidence.
          status["anonymous_profit_access_not_public"] = profit_classification != "failed"
          if profit_classification == "failed":
              errors.append("profit_admin_endpoint_unexpected_response")

          passed = all(status.values()) and not errors
          report = {
              "read_only_probes_passed": passed,
              "checks": status,
              "http_statuses": http_statuses,
              "server_created_course_checkout_access_reported": course_checkout_access,
              "stripe_payment_link_active_from_live_api": "not_checked_no_secrets",
              "real_paid_course_purchase_completed": "not_checked_no_charge",
              "profit_reporting_probe_classification": profit_classification,
              "profit_admin_authentication_verified": profit_classification == "configured_auth_denied",
              "profit_per_unique_visitor_verified": False,
              "customer_records_changed": False,
              "emails_sent": False,
              "test_charges_created": False,
              "broker_or_trading_calls": False,
              "errors": errors,
          }
          text = json.dumps(report, indent=2, sort_keys=True)
          print(text)
          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## NIJA public commerce readiness\n\n")
                  stream.write("No test charges, emails, leads or trading operations.\n\n")
                  stream.write("~~~~json\n" + text + "\n~~~~\n")
          if not passed:
              sys.exit(1)
          PY

  isolated-mocked-checkout:
    # An end-to-end synthetic purchase through a fake Stripe provider, private
    # course ledger, stubbed Resend delivery and access/refund controls.
    # This job has no credentials and never reaches external payment providers.
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NIJA_COURSE_DELIVERY_ENABLED: "false"
      STRIPE_SECRET_KEY: ""
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local billing test dependencies
        run: |
          python -m pip install -r requirements-billing.txt pytest
      - name: Verify profit-reporting fail-closed response classification
        run: python -m pytest -q tests/test_course_profit_probe.py
      - name: Assert synthetic payment, one-time delivery and refund denial
        run: |
          python -m pytest -q \
            tests/test_course_complete_delivery.py \
            tests/test_course_fulfillment.py \
            tests/test_course_portal.py \
            tests/test_course_sandbox_isolation.py
      - name: Record correct scope of synthetic validation
        if: always()
        run: |
          {
            echo '## NIJA isolated course checkout suite'
            echo 'Synthetic Stripe events, stubbed Resend and temporary SQLite only.'
            echo 'No real purchase, customer delivery or provider settlement is established.'
          } >> "$GITHUB_STEP_SUMMARY"
