name: Kraken history cursor recovery (offline)
on:
  pull_request:
    branches: [release/justcall-handoff-only-20261017]
    paths:
      - 'scripts/nija_kraken_readonly_history_collector_v441.py'
      - 'bot/kraken_authenticated_open_order_reconciliation_v482.py'
      - 'bot/kraken_live_history_recovery.py'
      - 'bot/universal_broker_exit_supervisor_patch.py'
      - 'bot/tests/test_universal_broker_exit_import_lookup.py'
      - 'tests/test_kraken_history_cursor_recovery.py'
      - 'tests/test_kraken_authenticated_open_order_reconciliation_v482.py'
      - 'scripts/nija_kraken_failure_receipt_triage_v464.py'
      - 'tests/test_nija_kraken_failure_receipt_triage_v464.py'
      - 'bot/tests/test_kraken_history_api_failure_diagnostics.py'
      - 'tests/test_broker_history_reconciliation_plan.py'
      - '.github/workflows/kraken-history-cursor-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.2.0
      - name: Compile changed Python
        run: python -S -m py_compile scripts/nija_kraken_readonly_history_collector_v441.py bot/kraken_authenticated_open_order_reconciliation_v482.py bot/kraken_live_history_recovery.py tests/test_kraken_history_cursor_recovery.py tests/test_broker_history_reconciliation_plan.py scripts/nija_kraken_failure_receipt_triage_v464.py tests/test_nija_kraken_failure_receipt_triage_v464.py bot/tests/test_kraken_history_api_failure_diagnostics.py bot/universal_broker_exit_supervisor_patch.py bot/tests/test_universal_broker_exit_import_lookup.py
      - name: Run offline recovery and identity checks
        env:
          NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_kraken_history_cursor_recovery.py tests/test_kraken_authenticated_open_order_reconciliation_v482.py tests/test_kraken_live_history_recovery.py bot/tests/test_nija_kraken_readonly_history_collector_v441.py tests/test_kraken_authenticated_identity_v480.py tests/test_broker_history_reconciliation_plan.py tests/test_nija_kraken_failure_receipt_triage_v464.py bot/tests/test_kraken_history_api_failure_diagnostics.py bot/tests/test_universal_broker_exit_import_lookup.py bot/tests/test_universal_broker_exit_supervisor_patch.py bot/tests/test_universal_broker_exit_recovery_import.py
