name: Privacy Data Protection

on:
  pull_request:
    paths:
      - 'PRIVACY_POLICY.md'
      - 'account_deletion_api.py'
      - 'api_server.py'
      - 'gateway.py'
      - 'tests/test_international_user_trade_reporting.py'
      - 'frontend/static/js/capacitor-init.js'
      - 'mobile/ACCOUNT_DELETION.md'
      - 'mobile/PRIVACY_POLICY.md'
      - 'docs/PRIVACY_DATA_FLOW_REGISTER.md'
      - 'tests/test_account_deletion_scope.py'
      - 'tests/test_account_deletion_ui.mjs'
      - '.github/workflows/privacy-data-protection.yml'

permissions:
  contents: read

jobs:
  isolated-privacy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          Flask==3.1.3 pytest==9.0.3 cryptography==50.0.0 PyJWT==2.15.1
          detect-secrets==1.5.0
      - name: Check changed Python and JavaScript syntax
        run: |
          python -m py_compile account_deletion_api.py api_server.py gateway.py tests/test_account_deletion_scope.py tests/test_international_user_trade_reporting.py
          node --check frontend/static/js/capacitor-init.js
          node --check tests/test_account_deletion_ui.mjs
      - name: Verify synthetic account cleanup and existing mobile controls
        run: >-
          python -m pytest -q
          tests/test_account_deletion_scope.py
          tests/test_mobile_production_hardening.py
          tests/test_mobile_security_contract.py
          tests/test_mobile_device_store.py
      - name: Verify user-facing deletion scope and failure handling
        run: node --test tests/test_account_deletion_ui.mjs
      - name: Scan this repair's files without remote secret verification
        run: >-
          detect-secrets-hook --no-verify
          PRIVACY_POLICY.md account_deletion_api.py api_server.py gateway.py
          frontend/static/js/capacitor-init.js
          mobile/ACCOUNT_DELETION.md mobile/PRIVACY_POLICY.md
          docs/PRIVACY_DATA_FLOW_REGISTER.md
          tests/test_account_deletion_scope.py tests/test_account_deletion_ui.mjs
          .github/workflows/privacy-data-protection.yml
