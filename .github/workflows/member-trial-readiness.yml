name: Member trial checkout readiness
on:
  pull_request:
    paths:
      - 'billing_service.py'
      - 'member_broker_availability.py'
      - 'tests/test_member_broker_availability.py'
      - 'tests/test_billing_service_contract.py'
      - '.github/workflows/member-trial-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-billing.txt pytest==8.2.2
      - run: python -m pytest -q tests/test_member_broker_availability.py tests/test_billing_service_contract.py tests/test_billing_checkout_store_regression.py
