name: CI — preflight check & lint

on:
  push:
    branches: [ main, release/justcall-handoff-only-20261017 ]
  pull_request:
    branches: [ main, release/justcall-handoff-only-20261017 ]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Verify Kraken journal Python syntax without imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              "bot/kraken_submission_journal.py",
              "tests/test_kraken_submission_journal.py",
          ):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          PY

      - name: Make scripts executable
        run: chmod +x ./scripts/prebuild-check.sh

      - name: Run prebuild checks
        run: ./scripts/prebuild-check.sh
