name: Build image (with GH_TOKEN)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single-platform CI builds do not need QEMU; its Docker Hub image is rate limited.

      - name: Build Docker image (using GH_TOKEN)
        id: docker_build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          BUILD_LOG="${RUNNER_TEMP}/nija-docker-build.log"
          # Retry from Docker Hub only when Public ECR itself rate-limits the base image.
          # Do not mask compilation, dependency or application build failures.
          set +e
          docker build --no-cache \
            --build-arg PYTHON_BASE=public.ecr.aws/docker/library/python:3.11-slim \
            --build-arg GH_TOKEN="${GH_TOKEN}" \
            --build-arg GIT_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            -t nija:latest . >"${BUILD_LOG}" 2>&1
          status=$?
          if [ "${status}" -ne 0 ] && grep -Eq '429 Too Many Requests|toomanyrequests: Data limit exceeded' "${BUILD_LOG}"; then
            echo "::warning::Public ECR rate limited the base image; retrying from Docker Hub"
            docker build --no-cache \
              --build-arg PYTHON_BASE=python:3.11-slim \
              --build-arg GH_TOKEN="${GH_TOKEN}" \
              --build-arg GIT_BRANCH="${GITHUB_REF_NAME}" \
              --build-arg GIT_COMMIT="${GITHUB_SHA}" \
              --build-arg BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              -t nija:latest . >>"${BUILD_LOG}" 2>&1
            status=$?
          fi
          set -e
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" -ne 0 ]; then
            echo "::group::Docker build failure tail"
            tail -n 240 "${BUILD_LOG}" || true
            echo "::endgroup::"
          else
            echo "::group::Docker build completion tail"
            tail -n 80 "${BUILD_LOG}" || true
            echo "::endgroup::"
          fi
          exit "${status}"

      - name: Upload Docker build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-diagnostics
          path: ${{ runner.temp }}/nija-docker-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Docker build success
        if: always()
        run: |
          status="${{ steps.docker_build.outputs.status }}"
          if [ -z "${status}" ]; then
            echo "Docker build status output is missing"
            exit 1
          fi
          exit "${status}"
