name: Kraken protected bootstrap boundary audit
on:
  pull_request:
    branches:
      - release/justcall-handoff-only-20261017
      - main
    paths:
      - 'scripts/audit_kraken_bootstrap_handoff.py'
      - 'tests/test_kraken_bootstrap_handoff_audit.py'
      - '.github/workflows/kraken-protected-bootstrap-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-bootstrap-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIJA_DEFER_RUNTIME_SITE_HOOKS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      KRAKEN_PLATFORM_API_KEY: ''
      KRAKEN_PLATFORM_API_SECRET: ''
      NIJA_RUNTIME_EXECUTION_AUTHORITY: '0'
      LIVE_TRADING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.2.2
      - name: Verify no-network, fail-closed private bootstrap diagnostic
        run: python -m pytest -q tests/test_kraken_bootstrap_handoff_audit.py
